# Ashfall Valley's monsters. The dinosaurs, the giant locust and the scarab swarm exist in the
# realm but no room ever spawned them; they are raised to the valley's band (levels 55-80) and
# put in monster group 18 (Group13), which holds only Ashfall's monsters. The generation index
# picks the tier each room spawns: 1 grazers, 2 raptors, 3 pteranodon, 4 giant locust,
# 5 deinodon, 6 scarab swarm, 7 viper cultist, 8 cult priest.
#
# Attack chances are cumulative: a slot's pct is the roll at or under which it is picked.

