[[text]]
number = 10203
text = """
{ansi:0}Tamsin spits into the fire.

{ansi:0;32}"Serpentkin, most of them, though not like any I knew before. They came down
 the vent a few years back and took the old temple, and now they feed the
 raptors and the raptors feed on anything else. Their priests lead the
 rites. Each one carries a {ansi:1;32}sigil{ansi:0;32} of black stone, a snake eating its tail.

 "I've watched them use those sigils on the sanctum doors. Bring me one and
 I'll see what can be made of it."{ansi:0}

{ansi:1;33}<Bring Tamsin a serpent sigil from a cult priest of the Coiled Temple.>{ansi:0}
"""

[[text]]
number = 10204
text = """
{ansi:0;32}"The priests carry the {ansi:1;32}sigils{ansi:0;32}, on chains around their necks. You'll find
 them deep in the temple, past the court. Bring me one."{ansi:0}
"""

[[text]]
number = 10205
text = """
{ansi:0;32}"You have the key. Whatever they're feeding is behind those doors, and I'd
 sleep better knowing it was dead. Go on."{ansi:0}

{ansi:1;33}<Slay whatever lies in the sanctum of the Coiled Temple.>{ansi:0}
"""

[[text]]
number = 10206
text = """
{ansi:0;32}"You've the look of someone with something to tell me. Is it the {ansi:1;32}mother{ansi:0;32}?"{ansi:0}
"""

[[text]]
number = 10207
link = 10218
text = "{ansi:40}\n"

[[text]]
number = 10218
text = """
testability 210 1:checkability 210 1:checkitem 5101 10301:takeitem 5101:giveitem 5102:giveability 210 2:addexp 25000000:text 10208
testability 210 2:checkability 210 2:text 10205
"""

[[text]]
number = 10208
text = """
{ansi:0}Tamsin turns the sigil over in her hands, then sets it on a flat stone by the
fire and strikes it once with the pommel of her knife. It splits cleanly in
two, and inside lies a long key of polished obsidian, carved as two serpents
twined together.

{ansi:0;32}"I thought so. They don't open the doors with the sigils, they carry the keys
 inside them. Take it. What's in that sanctum has been growing for years. Kill
 it before it hatches whatever it's sitting on."{ansi:0}

{ansi:1;33}<Tamsin gives you an obsidian serpent key.>{ansi:0}
{ansi:0;36}<You gain 25,000,000 experience!>{ansi:0}

{ansi:1;33}<Slay whatever lies in the sanctum of the Coiled Temple.>{ansi:0}
"""

[[text]]
number = 10209
link = 10219
text = "{ansi:40}\n"

