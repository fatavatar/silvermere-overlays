[[text]]
number = 10210
text = """
{ansi:0}Tamsin listens without a word as you tell her of the sanctum and the thing in
it. When you finish she lets out a long breath and, for the first time, smiles.

{ansi:0;32}"A mother. Gods. Then the eggs are cold now, and the cult has nothing left to
 pray to." She ducks into the lean-to and returns with a folded tunic of green
 and black scales. "Viperhide. I took it from the first cultist who tried to
 kill me. It's yours, you've more need of it than I have."{ansi:0}

{ansi:1;33}<Tamsin gives you a Viperhide Tunic.>{ansi:0}
{ansi:0;36}<You gain 60,000,000 experience!>{ansi:0}
"""

[[text]]
number = 10211
text = """
{ansi:0;32}"The valley's quieter since you went into that temple. Not quiet, mind. But
 quieter."{ansi:0}
"""

[[text]]
number = 10212
text = """
testability 210 2:checkability 210 2:giveability 210 3:text 10213
"""

[[text]]
number = 10213
text = """
{ansi:0}With a final shudder the Coil Mother's great body goes still, and the coils
slide loose across the bones of her nest. In the silence you hear a faint
tapping from inside the nearest egg, and then nothing at all.

{ansi:1;33}<Return to Tamsin at the ranger's camp and tell her of the mother.>{ansi:0}
"""

# ---------------------------------------------------------------- lore

[[text]]
number = 10214
text = """
{ansi:0;32}"Raptors run in packs, three or four, with a big one leading. Kill the leader
 and the rest scatter, sometimes. The ones with the long claw on the foot carry
 a poison that makes your arm go numb. Don't let them get behind you."{ansi:0}
"""

[[text]]
number = 10215
text = """
{ansi:0;32}"The Coiled Temple. It's old, older than the cult, older than anyone knows. The
 serpentkin say their ancestors built it before the volcano woke. North wall of
 the basin, past the big fern. Mind the court; they keep scarabs there."{ansi:0}
"""

[[text]]
number = 10216
text = """
{ansi:0;32}"The volcano keeps it warm, the vents keep it wet, and nothing has hunted the
 beasts down here in a thousand years except each other. The big grazers will
 leave you be if you leave them be. The king of the tar pits won't."{ansi:0}
"""
