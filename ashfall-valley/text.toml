[[text]]
number = 10201
text = """
{ansi:0}The ranger looks up from the fire and rests a hand on her bow, watching you the
way she watches the ferns. After a long moment she nods at the fire.

{ansi:0;32}"Sit, if you're staying. Not many come down the vent, and fewer climb back up.
 The {ansi:1;32}valley{ansi:0;32} will try to eat you, and the {ansi:1;32}raptors{ansi:0;32} will try first. But it's the
 {ansi:1;32}cult{ansi:0;32} you should worry about. They've dug themselves into the old {ansi:1;32}temple{ansi:0;32} in
 the north wall, and they're breeding something in there."{ansi:0}
"""

# ---------------------------------------------------------------- the quest

