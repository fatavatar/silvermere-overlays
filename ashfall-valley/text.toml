# Tamsin the ranger and the quest "The Coiled Temple" (ability 210 holds the step):
#   0 -> 1  ask about the cult: she asks for a cult priest's serpent sigil
#   1 -> 2  bring the sigil: she gives the obsidian serpent key to the sanctum
#   2 -> 3  kill the Coil Mother (her death spell runs text 10212)
#   3 -> 4  tell Tamsin of the mother: the Viperhide Tunic and experience
# Ability 210 is not one of the game's named abilities; the realm keeps its own quest markers
# (200-203) the same way.
#
# Asking about a topic shows the topic's block and then runs that block's link as a script, so
# each quest topic is a blank block (as the realm's own are) linking to its script.
#
# Markup: {ansi:N} is the escape sequence ESC[Nm. Narration is plain ({ansi:0}), speech green
# ({ansi:0;32}), keywords bright green ({ansi:1;32}), goals yellow ({ansi:1;33}).

