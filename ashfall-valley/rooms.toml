[[room]]
map = 19
room = 61
name = "Ashfall Valley, Trading Tent"
desc = """
Under a patched canvas awning, crates and sacks have been stacked
against the rock: coils of rope, lamp oil, bundles of arrows and a
barrel of salt meat. A slate hung from the pole reads, in a careful
hand, TAKE WHAT YOU NEED. BRING BACK WHAT YOU CAN.
"""
exits = { east = 59 }

