name = "Ashfall Valley, Tar Pit Hollow"
desc = """
The tar flats sink into a broad hollow ringed with trampled ferns and
the wreckage of things too slow to escape. The ground shakes with a
slow, heavy rhythm, and a stench of rotting meat hangs in the hot air.
This is the lair of whatever rules the valley.
"""
exits = { west = 75 }
specmon = 508

