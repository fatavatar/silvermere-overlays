room = 12
name = "Ashfall Vent, Mouth"
desc = """
The fissure opens onto a ledge above a wide green valley. Far below,
mist drifts over a sea of giant ferns, and the volcano's walls rise on
every side to a roof of rock lit red by distant fires. Something huge
bellows in the haze, and a flock of leathery shapes wheels away from
the sound.
"""
exits = { north = 50, south = 11 }

