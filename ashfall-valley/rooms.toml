Ferns taller than a man crowd around you, their fronds beaded with
warm water. The ground is soft black ash that takes every footprint,
and many of the prints here are larger than your hand and end in long
claws. Steam hisses from cracks in the earth, and the air is thick
enough to drink.
"""
exits = { north = 44, east = 55, west = 53 }
room_type = "Lair"
mongroup = 18
minlevel = 1
maxlevel = 3
maxmonsters = 2

