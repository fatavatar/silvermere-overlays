[[room]]
map = 19
room = 59
name = "Ashfall Valley, Ranger's Camp"
desc = """
A ring of sharpened stakes guards a small clearing on a rise above the
ferns. A lean-to of hides stands against the rock, and a fire burns
low under a rack of drying meat. Bones of enormous size have been
stacked carefully by the stakes, as if someone has been counting.
"""
exits = { north = 60, east = 32, west = 61 }
specmon = 2103

