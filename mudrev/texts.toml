parts = ["""
When you flash the crimson medal at him, he leans back in his seat and laughs
mightily. He gestures for you to come closer, and as you do he begins to speak:

"So, Fulgore is still around? He was a useless wretch when I was in training,
and I'm certain he still is. The fact that Thorand found you worthy is enough
for me to offer you a place in the Obsidian Order, but of course I must set you a task... Ah, of course, the \u001B[1;32mGlabrezu\u001B[0;32m in the caverns below. It was to have
remained bound until I had a chance to dispatch it personally, but a day's work for one is death for another... If you choose, you may venture into the \u001B[1;32mcaverns\u001B[0;32m and endeavor to slay the hellspawn for your task, but I warn you it will be an
arduous one which you may not survive. If you do slay him, \u001B[1;32mreturn\u001B[0;32m to me with
proof and I will gratefully name you brother."
"""]

