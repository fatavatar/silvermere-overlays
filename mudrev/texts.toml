parts = ["""
\u001B[0m
You quietly inform the Grey Lord of your travels to Arlysia, contact with the ancient gypsy, and eventual knowledge gained from Maxmillion concerning the prophecy which Zanthus prepared. He takes all of this in with his same impassive stare, showing nothing of emotion. Finally you speak of your failed attempt at destroying the newly created Lich. You note with some distress the slight frown that approaches on the neutral one, before it quickly vanishes.

Finally his voice is heard in your mind,
\u001B[0;32m
<Indeed your effort is commendable, however the results are less then ideal. 
It would seem our forces are at their most weakest while this darkness gains more in power and might. Though he surely must rest to have fashioned this portal into a Shadow World, but all too soon he shall surely come forth again with the forces of this blackest prophecy in his grasp.>
\u001B[0m
A piece of grey silk appears before you, covering something which seems to expand and contract, the Grey Lord signals you to take it and you grasp the silk and place it in your inventory. You turn back to him only to see him wave you away. His voice faintly echoing in your skull..
\u001B[0;32m
<Once again we await his move before we may work against him. It is not often the forces of Balance become the pawns in the Great Game, but his powers of concealment leave us no other option. Rest now, Bound One, all your energy will be needed for our next battle.>

"""]
