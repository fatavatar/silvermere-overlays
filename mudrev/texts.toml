parts = ["""
\u001B[0mWith the fatal blow to the dark phoenix, the massive bird shattering
cry that bounces off the stone walls. Fire shoots out from the bird
on all sides, and you have to take cover to avoid being burned.

Finally the dying bird is almost consumed when it suddenly explodes
in a flash, leaving only bits of darkened feather behind. As the
feathers fall to the ground, a tall figure dressed in black robes,
carrying a bleached bone staff, appears in front of you. At first
you are stricken with fear, for the robed figure could be a replica
of the grim reaper. Then it speaks and you realize he is something
more terrifying.

\u001B[0;32m"I know not who sent you wretch, but tell them that they
can not avoid my wrath,"

\u001B[0mthe figure says, in a voice that sounds like the door of an ancient, rusted crypt that has just been opened. 
A long boney finger stretches out from the folds of the robe, and stabs at you like a dagger.

\u001B[0;32m"I have prophesised my return, and your meddling has done
nothing but bring it closer to hand. My wrath shall plunge
this realm into darkness, and I shall be ruler of death!"

\u001B[0mThe figure then vanishes, leaving only a smell of decay behind.

\u001B[0;36m<Congratulations you have slain the dark phoenix! 
You gain 60,000,000 experience for your efforts. 
Now return to your quest leader!>"""]
