parts = ["""
The faerie queen stops her meandering flight and hovers in mid-air, looking at
you with a seriousness unusual in her kind. In a light, almost childish voice
she speaks, "Greetings and welcome to my realm, adventurers. I trust you are
not here for refreshments," at which she giggles loudly, "since my guests
seldom leave again, and you look to be on a mission of your own. As it happens, I have need for the \u001B[1;32mservices\u001B[0;32m of an adventurer; perhaps you could help me?"
"""]

[[text]]
link = 0
number = 8199
parts = ["""

"Deep in the bronzewood forest lives a tribe of quicklings. They have long
preyed upon my gentle children, who are less able to defend themselves than I.
Their lord wields a blade of darkness, a dagger coated with a poison distilled
from the blood of his prior victims. We faeries are sworn to peace except in
self-defense, but I would be eternally grateful to you if you could dispatch
this quickling lord for us. In addition, one of his minions recently stole a
jewelry box containing a magical trinket from a messenger of mine. It was to be
taken to the woodelf lord, but if you dispatch the quickling lord you may use
this key to open the box and keep the trinket for your own."

"""]

