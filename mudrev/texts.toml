[[text]]
link = 0
number = 8244
parts = ["""
The spectral figure salutes you with its blade, no expression showing on its
face as it begins to speak in a quiet tone, almost whispering.

"Greetings, mortal. It has been long since I have been disturbed here, except
by the occasional \u001B[1;32mdragon\u001B[0;32m with no survival instinct. As you have no doubt
discovered, they are quite ferocious, even to the point of attacking me. This,
naturally, is a futile endeavor, as even the remains of my body have long been
removed from this place for proper \u001B[1;32mburial\u001B[0;32m."
"""]

[[text]]
link = 0
number = 8245
parts = ["""
"Long ago, before Silvermere even stood, a mad alchemist by the name of
Shrefwan lived deep below the earth, fled here to work his arts without meeting
the censure of his brethren. For the most part, his experiments focused on
dragons, specifically their reactions to the various chemicals he had concocted
over the years. After observing the dragons he used for subjects, he no longer
had any use for many, so he simply released them into the caverns. When the
wererats established their colony in the sewers, they unknowingly tunneled into
the dragons' territory, and ever since the sewers have been in a state of
constant turmoil. Even here, so close to the surface, many large dragons have
established lairs. One in particular, ancient but weak for its years, was the
agent of my \u001B[1;32mdemise\u001B[0;32m years ago -- if only I were not bound to this spot, I could
have my revenge, for it still lairs near here."
"""]

[[text]]
link = 0
number = 8246
parts = ["""
"Although my spirit is bound to this spot, I have learned through ages of
imprisonment to communicate with the vermin that infest the sewers, simple
creatures, but they bring news of the outside realm. I have been told that my
body has been interred in a mausoleum just north of Silvermere, but no more. I
do hope my remains are receiving the proper respect due a dragonslayer such as
myself, but I suppose in this state there is nothing I can do either way."
"""]

[[text]]
