their carnage. There are no words to express my thanks, but know that you
may have saved the lives of thousands of innocents! And... Lord Markus bids
me to give you this ring. It is of dwarven craftmanship, and while worn will
speed the healing of your wounds. May it prove useful in your journeys. Now,
however, I have a great task ahead of me, and I must get back to work.
Perhaps in the future I will have further need of your services, and you may
once again venture forth on a \u001B[1mquest\u001B[0;32m in the name of goodness, but
for now,  brave adventurer... Godspeed."\u001B[s

