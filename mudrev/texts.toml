[[text]]
link = 0
number = 8143
parts = ["""
The Grey Lord's piercing eyes seem to open your soul, and before you can speak
his thoughts again echo in your mind:

<So, Zanthus has shown himself again. His plot seems to be proceeding despite
all my precautions, but you must  remain vigilant for further developments.
Vanquishing his physical aspect seems to weaken him, judging from your last
encounter. Things have advanced sufficiently that it is time for me to take a
drastic measure - if you accept, I will instill some of my power in you and
make you an Avatar of Balance. This will strengthen you for any further
encounters with Zanthus and the forces of chaos.>

The Grey Lord stares hard at you, and you feel your body begin to tingle with
power. After a few minutes, when the tingling has become nearly unbearable, his
eyes flash and you abruptly feel very heavy.

\u001B[1;33mYour maximum hitpoints increase!

