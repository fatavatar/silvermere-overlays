parts = ["""

When he recognizes you he looks around furtively to make sure there is no one
watching from the street, then speaks.

  I know many spells, but before I teach you anything I must warn you, you are
  about to make an important choice. \u001B[1;31mOnce you embark upon a path of magical
  learning, you are bound to follow that path, by the very energies of the
  forces you will call upon.\u001B[0;32m I myself am unable to cast any of my spells
  because my hunger for learning grew out of control, and I ventured far beyond
  my rather limited talents.

At this he grins ruefully, shaking his head.

  However, that should not happen to you, and will not if I have anything to
  say about it. So tell me now, what path shall you follow?

 \u001B[0;36mThe \u001B[1;37mpriestly\u001B[0;36m path, devoting yourself to your deity?
 The \u001B[1;37mdruidic\u001B[0;36m path, calling upon the many spirits of nature?
 The \u001B[1;37mwizardly\u001B[0;36m path, shaping the powers of the cosmos to your will?


\u001B[1;31m          <Game note: this choice is NOT REVERSIBLE at the
           moment, and may never be. Choose carefully!>\u001B[0m

"""]

