[[text]]
link = 0
number = 4397
parts = ["""
"Aye, not long ago at our fortress, two cloaked women arrived demanding word with our leader. Of course, we were immediately suspicious. When their cloaks flew off we were in the presence of fiery witches!  They  shouted claims that they were Irikani's avengers, and demanded our surrender,  or be turned to ashes! We put up quite a fight though, and had almost bested  them. Their magic was too weak and pathetic to pierce our fortress walls and our armour."  

The man smirks with pride. 

"However they fled and we were unable to keep up with them. Those two were so pathetic during that battle, only ten were set out to exterminate them, thinking it would be an easy win."  

He shades his eyes and looks around.

"Well this wretched volcano is where we tracked them to, obviously the heat here increases their power. I was hoping to take a \u001B[0;1;32mlock\u001B[0;32m of hair from one of their corpses, a trophy of sorts, but that seems much more difficult given my current situation. On my journey here, I also heard tales of an altar the wenches worshiped at and used to fuel their unholy powers. By the tales, if the witches are defeated, one could destroy the altar simply by dousing the flame, or by striking the altar itself a single blow powerful enough to shatter it." 
"""]
