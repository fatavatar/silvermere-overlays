number = 8269
parts = ["""
"Gnaj's protectors are crafted to provide the finest defense, but as he has
imprisoned me against my will I have crafted them so that a well-informed
attacker can easily overcome Gnaj's power. Although, with his protectors, Gnaj
is nearly invincible from any frontal assault, his most deadly guardian is the
trap built into the golems he controls. Although he may be physically weak, his
magic is powerful, and his guardian golems are in fact merely ticking time
bombs awaiting the trigger to destroy. If you avoid attacking his guardian
golems, Gnaj will fall easily, leaving you free to ignore or dispatch the
golems as you see fit. When you have vanquished him, bring me his eyes as a
token and I will give you the information you require to seek out \u001B[1;32mHelvectus\u001B[0;32m and
destroy him once and for all."
"""]

