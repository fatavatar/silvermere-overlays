parts = ["""
Annora looks up from her desk as you approach. She seems to be full of nervous
energy, and you wonder what could shake her so much. She says abruptly, "As
you no doubt know, the portals created long ago by Morukai are functioning
again, due to the energies released in your confrontation with Zanthus. I have 
received word from the King of Nazareen, a large city to the north which has
been unreachable for centuries. Now that the portals are open, we can
communicate easily again, but there is nothing good to be said. Zanthus has
fled, but we do not know when or where he may strike again, and Nazareen is in
danger of being overwhelmed any day. If you could travel there and see what \u001B[1;32maid\u001B[0;32m you might be able to give him, it would greatly ease our efforts here. Whatever happens, I ask that you return and tell me of your \u001B[1;32mjourney\u001B[0;32m. I only hope Zanthus does not strike again, or worse yet, ally himself with the forces encroaching
