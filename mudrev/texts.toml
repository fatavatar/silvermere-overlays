parts = ["""
Tyrphax laughs, almost contemptuously, at you as you ask about the Glabrezu.
Slamming his fist on the desk he tersely says, "Well, not much to tell about
the Glabrezu. A greater demon, it is, as deadly in close combat as with its
fire magicks. It may also hypnotize the weak-minded, throw you into an
unnatural darkness, or even manipulate time on a small scale. Head of a dog,
body of a man, and claws of a crab - a monstrosity!"
"""]

