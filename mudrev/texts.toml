[[text]]
link = 0
number = 178
parts = ["""
The man introduces himself, saying, "Greeting, traveler. You have found the
prison of the Archmage Dhelvanen. And prison it is, although its appearance
says otherwise... I cannot leave these chambers. Despite all the powers at my
command, I am trapped here, helpless." He clenches his fist, and furrows his
brow in frustration. Letting out a small sigh, he continues, "A long while
ago, when I was younger and more foolish, I felt my power was so great that I
could accomplish anything. However, this was not enough. My lust for power
was so great, my obsession so powerful, that my every waking moment was spent
in the search for even greater power. In my travels I discovered an ancient
document revealing a method to increasing the strength of my spells by
enough to make me so incredibly strong in the arts of magic that an entire
army would wither before my assault. Visons of glory and mastery of lands
passed through my mind, and immediately I set out to find the material
components needed in the ritual. The main component was the scale of a
powerful, aged \u001B[1;32mdragon\u001B[0;32m." He coughs slightly, and shakes his head as if coming
out of a dream. He looks you over, saying, "I am sorry, I tend to ramble on,
having company so incredibly rarely has corroded my social skills. Let me
finish by saying this. If you would be kind enough I always need \u001B[1;32mhelp\u001B[0;32m finding 
scrying supplies, and could make it worth your while. Also, new information I 
have found by scrying other worlds has given me \u001B[1;32mhope\u001B[0;32m of escaping my prison 
here. I would ask your \u001B[1;32mhelp\u001B[0;32m if you are willing to give it."
"""]
replace = true

[[text]]
link = 0
number = 179
parts = ["""
Dhelvanen says, "Yes, the dragon. What a fool I was for believing myself
powerful. Compared to her, I was a child. What dragon you may ask? Well, my
travels through the lands led me to these very caverns. Having researched
various rumours concerning the whereabouts of powerful dragons, and having
conducted arcane searches, I found that one old she-dragon laired deep within
these caves, far to the east, in a lava flow. Upon finding her lair, I cast a
powerful spell of concealing, and slipped by her deadly brood unnoticed. As I
entered the vast cavern within which she dwelled, I found her waiting for me.
What incredible stupidity to have thought I was a match for her. She saw
through my spell as if it were nothing more than a feeble child's cantrip. In
desperation I threw bolts of energy, to distract or wound her, but she
shrugged them off. With one gutteral word she froze me in my tracks, and then
proceeded to devise ways to make me pay for my arrogance, telling me these in
an amused tone." He pauses a moment, and then continues, "Well, to make a
long story short, she created these chambers, let me take some things from my
home, and then sealed them off from normal space with her magics. I am unable
to leave these rooms. I do not age while I am here, nor can I die. My only
comforts are in my books, weaving tapestries, scrying the outside world with
my powers, and devising some method of revenge.""""]
replace = true

[[text]]
link = 0
number = 180
parts = ["""
Dhelvanen says, "You could help me greatly by satisfying my insatiable need
for revenge. If there is some way you could bring about the demise of that
cruel she-dragon, I would reward you with a powerful artifact of magic. Of
course, to slay her you would need a large party of extremely powerful
adventurers, no single person could possible hope to survive. Failing that, I
could reward you for fetching a few lesser things for me... for some of my more
powerful scrying techniques, I need the eye of a cyclops. And in for some of
the more delicate weavings I make, spider silk is invaluable. For either of
these things I would give you a lesser magic item. Good luck in your travels,
adventurer." He thinks for a second, and then says, "Oh yes... if you decide
to brave the dragon you will need some sort of protection to survive in the
extreme heat of the lava flow... if you bring me the hide of a greater
hellhound, I will be able to fashion an amulet that will let you survive the
temperature. Note that it will NOT protect you from actual damage! But it WILL
let you pass through the lava area."

Dhelvanen contemplates for a moment more, then snaps his fingers and says, "Of
course, if you are feeling truly brave, I have devised a new scrying technique
which requires some very rare \u001B[1;32mcomponents\u001B[0;32m. I would reward you well for
providing them."
"""]
