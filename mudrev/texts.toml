parts = ["\u001B[40m\u001B[2J\u001B[0mYou show him the gleaming meteoric shard, and a wondering look lights up his\u001B[2;1Hface. When you tell him the tale that Loremaster Thulgraf gave you, he nods\u001B[3;1Hwith a broad grin, and exclaims:\u001B[5;1H\u001B[0;32m\"Aye, this would indeed do the trick! I will stop what I'm doing and work on it\u001B[6;1H at once. A dagger ye need, and a dagger ye'll get!\"\u001B[8;1H\u001B[0mWith a blur of motion, he tosses the shard in his forge, and gets to work.\u001B[10;1H\u001B[0;33mClang\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u001B[s\u0