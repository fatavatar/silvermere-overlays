 is but a puppet of the Dark One. They are here crafting a plague of horrifying
 power, designed to slay all the mannish races, and their allies-- humans,
 elves, dwarves, gnomes, kang... all will be slain, leaving the rest of the
 races of the world free to be preyed upon by the surviving evil forces.
 Fortunately for the denizens of light, they have not yet succeeded in
 formulating the plague, though they have crafted other, less specific diseases
 in their attempts. The wererats are nearly immune to plagues and are 
 completely immune to poisons, making them ideal allies in this project. They
