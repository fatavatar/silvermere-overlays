[[text]]
link = 0
number = 438
parts = ["""
\u001B[0mBalthazar waves his hand idly, and you are surrounded in a \u001B[0;1;31mred \u001B[0mglow! The severed head of Commander markus and the locked Darkwood box float out of your possession, and into his hands.\u001B[s
\u001B[0;32m"It is rare to find an adventurer of your reliability and lack of scruples. I am pleased you succeeded in obtaining these for me. However, I have no further use for this... offal," he says, shaking the head, "and you deserve a reward."\u001B[s

\u001B[0mWith that, he begins to weave an intricate spell, and the severed head rises into the air. It begins to spin rapidly, the flesh and hair drying up and disintegrating as a black wispy smoke surrounds it! After a few moments, a soft screeching sound can be heard, and the now-bare skull begins to darken and shrink until it is no larger that the end of your thumb!\u001B[s
\u001B[0;32m"What you have just witnessed," he says, "was the capture and confinement of  the soul of Commander Markus within his very own skull. By my power, his life essense now will fuel your own, and he will remain trapped and in agony for eternity within."\u001B[s
\u001B[0mWith a snap of his fingers, Balthazar summons a glittering black ring forth from the ether. It floats over to the still-spinning shrunken skull, and they merge to form a ring! With a small wave of his hand, the eyes in the skull begin to burn with an unholy red light. The ring then floats over to you, and you take it gingerly in your hand.\u001B[s

\u001B[0;32m"While you wear this ring, his life force will be tapped, and will aid your wounds in healing. It is but a simple bauble, but greater rewards may be given for greater tasks. Perhaps in the future, I shall have more \u001B[0;1;32mwork\u001B[0;32m for you. But now our business is concluded. I am a busy man, and I have no more time for you."\u001B[s
\u001B[0mBalthazar lazily waves you out, picks up a book, and begins to read.\u001B[s

\u001B[0;36m<You gain 300,000 exp for your skill in completing this evil deed!>
"""]
replace = true

