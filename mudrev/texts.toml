[[text]]
link = 0
number = 8123
parts = ["""
As you mention Zanthus, Chancellor Annora immediately becomes more attentive.

"This is dire news indeed, but I am glad to hear his latest incarnation has
been vanquished. Were he to regain physical form in his full might, our doom
might truly be at hand, but every time his host dies his spirit suffers
accordingly. I do wish you had been able to capture his gem, but the immediate
danger is gone at least. In recognition of your outstanding service, I will
pray for the Light to once again strengthen you with its benediction."

Annora folds her hands in an attitude of prayer and closes her eyes for a
moment. As you bow your head to do the same, a blinding white light engulfs you
and you lose all sensation in your body for a moment.

\u001B[1;33mYour maximum hitpoints increase!

\u001B[0;36m<You gain 3,000,000,000 experience!>\u001B[0m
"""]

