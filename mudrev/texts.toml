[[text]]
link = 8003
number = 8002
parts = ["""
\u001B[0;32mOrfeo sits back in his chair, a far-off look coming over his face.

"Ah yes, the madrigals.  They are legendary, and rightfully so. I wonder
if you truly have mastered the art enough to control their power - I
have seen master musicians go mad merely looking at the songsheets."

He leans forward, peering intently into your eyes...
"""]

