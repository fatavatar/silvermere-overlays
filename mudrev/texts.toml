\u001B[0mJust as you are beginning to stand up, expecting no answer, a cool wind blows
through the shrine!

\u001B[0mHundreds of sparkling lights dance in front of you, and a voice like the 
sighing of the wind fills your ears:

\u001B[0;32m"Rare are the pilgrims to my shrine, and rarer still since my power wanes. What
 brings you here to Aerdwyne's forgotten abode?"

\u001B[0mYou humbly speak about the Grey Lord and his wishes.

\u001B[0;32m"The Grey Lord is a friend indeed, and is correct when he worries that 
 something has gone amiss. The truth of the matter is that this unnatural swamp
 sprang up around my shrine, and it smacks of black sorcery. Travelers could no
 longer stop here to pray, and with their absence my power wanes. Of late, I
 cannot even send down my Avatar to perform her duties, which is a sore blow to
 the balance of things. This is one reason why the war between the light and
 darkness is escalating."

"You must provide me with the energy to send down my Avatar. This is no easy
 task, and will require you to seach throughout the realm for four elemental
 artifacts. The first is the Ice Tear, and will represent the sorrow for the
 injustices that pass unanswered in the world. The second is the Eternal Flame,
 a sphere of heatless flame that will symbolize the ceaseless search for
 Justice. The third artifact is the Heartstone, an indestructible gem of a 
 thousand facets. It reflects the need for eternal vigilance and the myriad
 forms that righteousness can take. The fourth and final artifact is the Spirit
 of the Storm, and it represents both the lightning-swift judgement and the
 righteous fury of the agents of Justice."

"These four artifacts must be collected in the proper order-- the \u001B[0;1mIce Tear\u001B[0;32m,
 then the \u001B[0;1;33mEternal Flame\u001B[0;32m, \u001B[0;31mHeartstone\u001B[0;32m, and \u001B[0;1;36mStorm Spirit\u001B[0;32m. Water must balance
