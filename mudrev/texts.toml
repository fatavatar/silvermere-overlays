parts = ["""
\u001B[0mYou tell Annora of your travels, the loss of Pastor Lander, and the unfortunate conclusion of the meeting with the Dark Mage. Her eyes close and she appears to be holding back tears. She opens them again and you wonder if she has slept at all since your mission began. She gathers her thoughts slowly before speaking, 
\u001B[0;32m
"Truly this is the gravest of times we have known, I was hoping to be rid of this problem and yet he continues to become worse each time." 
\u001B[0m
Another sigh leaves her and she looks as if she is near collapse, when suddenly she speaks again. 
\u001B[0;32m
"Well, now we must wait for him to make his move yet again. We must hope we can perform better than in the past." 
\u001B[0m
Finally the Chancellor seems to have gained control of herself. She looks up at you, and the determination in her eyes clearly outshines her grief as she bids you farewell.
\u001B[0m
She makes a signal and a priest enters the room, bearing something in a large cloth. 
\u001B[0;32m
"Take this from our vaults for your hard work during the mission, you have my leave." With that she returns to her chair, exhausted even more by your visit.
"""]
