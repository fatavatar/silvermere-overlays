parts = ["""
The King looks up at you from his meal, seemingly surprised to be disturbed.
In a booming voice he tells you to sit and join him as he calls for servants.
As the two of you dine, he begins to speak between, and sometimes through, his
mouthfuls of food.

"You look to be an adventurous type. This is usually a peaceful city, but
lately there have been disturbances. Our walls are enough to protect us from
the wilderness, but lately I have heard tales of more dangerous monsters in
the area, and many caravans have been vanishing. As we are a peaceful city
with no trained guards, I feel we may be in danger!"

He gestures wildly with his fork for a moment as he becomes more excited, and
you duck as a piece of venison flies just past your head.

"This cannot be! After working so hard, it cannot all come crashing down like
this!"

He subsides, looking at you through wide eyes.
"""]

