\u001B[0mThe Spacelord nods to you with a kind smile and says,

\u001B[0;32m"Greetings, mortal. Your presence here tells me you have surpassed the puzzles
of the pawn \u001B[1;32mNahr\u001B[0;32m, and thus proven yourself worthy of my personal attention. I
require the services of an adventurer such as yourself, for there are dark
powers at work to corrupt the realm you know. The master of that pitiful fool
\u001B[1;32mZanthus\u001B[0;32m is stirring, and Zanthus' own plots are as the fumblings of a child
compared to his master."
