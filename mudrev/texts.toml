parts = ["""
The once deadly mistress now slumps over in a heap, her skin once pink,
now pale and ashen. She drops her two handed blade to the ground, as her
other hand grasped her side, blood seeping out between her fingers.
Barely whispering she says to you, "You have my congratulations, you have
bested me, my minions and my traps. Before I leave the world I must pass
this SECRET of the shadowstalkers on to you."
"""]
