[[text]]
link = 0
number = 8194
parts = ["""
As you strike the altar with a mighty blow, the air seems to thicken around
you, and you feel magical energy crackle all about you. The flame sputters and
suddenly dies out, and the room is instantly pitch dark. Suddenly the altar
begins to glow brightly, and you see hairline cracks appear all over it,
quickly spreading until the massive stone altar crumbles to dust. The glow you
noticed, however, does not move. You stare at it for a moment, until your
eyes are assaulted by a blinding flash as the lighting returns to normal. You
notice one small fragment of the altar remains, and gingerly pick it up, wary
of the burning heat emanating from it. As you grasp the firestone, the room is
momentarily obscured again by the form of a massive shadowy wolf rising up
before you, a man armed with a long spear mounted upon its back! As quickly as
it appeared the vision is gone, leaving you shaken but intact.

\u001B[1;33mYour eyes tingle with a strange power!\u001B[0m
\u001B[0;36m<You receive 80,000,000 experience for destroying the altar!>
"""]

