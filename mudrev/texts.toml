You hand him the letter which the nomad gingerly takes, mumbling something under his breath he opens the seal, and pours over the contents. His face clouds up with dark thoughts, and he finally crumples up the letter, tossing it into a vat of soiled water nearby. He then hands you a small vial and merely says, "My thanks to you for this bit of news, take this now, as my sign, from whence you came."

"""]
