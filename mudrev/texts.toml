"Well... of course you aren't here to kill me. The Astromancer and I have an
alliance, and he respects that. You would not dare to actually threaten me. As
for the charm, of course I will be glad to aid my ally's servant."

He hands you a small silver bracelet and returns to his meal, still somewhat
pale, as you walk away laughing to yourself.
"""]

