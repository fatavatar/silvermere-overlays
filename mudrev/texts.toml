number = 8004
parts = ["""
\u001B[0;32mOrfeo leans back in his chair calmly and says, "It seems you may be experienced enough in your art to survive the madrigals. However, I still cannot be sure
you are \u001B[1;32mworthy\u001B[0;32m to learn these powerful melodies. In these uncertain times, one
can never be too sure, and in the wrong hands they could be dangerous."
"""]

[[text]]
link = 0
number = 8005
parts = ["""
A pained expression comes across Orfeo's face, one of the few times you have
ever seen him show emotion.

"Upon first learning the madrigals, I did not realize their power was so
great it could drive a man mad. I attempted to teach one to a student of
mine. He studied for several days before the change began, and I did not
understand what was happening at first, more the pity. Before I knew, he
had fled, taking my platinum flute with him. I have another now, but it is
far from the same caliber enchantment."

Again he grins, flicks his wrist and produces a sparkling platinum flute,
which vanishes again in an instant along with his quicksilver grin.

"Last I heard, my erstwhile student has taken up wizardry and is wandering
the Shimmering Wastelands, killing any he encounters. I do not know who
taught him planar travel, but he is beyond my reach there. If you could
dispose of him and \u001B[1;32mreturn\u001B[0;32m my flute I might see clear to instruct you."
"""]

[[text]]
link = 8007
number = 8006
parts = ["""
Orfeo looks up at you curiously...
"""]

