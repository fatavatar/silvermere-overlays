\u001B[0mYou give her the news of Commander Markus, and hand her the darkwood box.

\u001B[0;32mChancellor Annora leaps up with a smile, exclaiming, "Well done! I had hoped for you to be skilled and courageous, but it is wonderful to behold! Please excuse me a moment while I read Lord Markus' reply, it is very urgent."\u001B[s

