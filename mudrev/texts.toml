number = 8010
parts = ["""
Dhelvanen seems surprised for a moment, then smiles and says, "Brave indeed,
adventurer. I only hope your bravery will hold you after I tell you what I
\u001B[1;32mrequire\u001B[0;32m. First, I will need the fang of a dragonbat. However, the species is
thought to be extinct, so it may be difficult to find, to say the least.
Second, the outer skin of a mature displacer beast. The displacer beasts are
known to be viciously competitive, and usually there will only be one mature
beast living at a time. Third, a blue wyvern scale. The scale must be from an
adult wyvern, as the scales of the young do not have sufficient tensile or
magical strength. Fourth, the heart of a dark giant. The heart must be
instilled with magical power as well, and unfortunately dark giants who can be
made to comprehend even the idea of magic are few and far between. The final 
