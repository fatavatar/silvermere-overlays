The hooded mage gazes at you evenly as you approach. Before you can speak, he
immediately begins,

"Greetings, adventurer. I am lord of Darken Castle, and of the kingdom of
Darkenmoor in my own realm. Now, perhaps, my kingship could be contested -- but
I have discovered a \u001B[1;32mritual\u001B[0;32m I may be able to perform with your aid. With this
ritual I will be able to summon sufficient power to move my castle back to my
own realm. For the ritual to be possible, however, I will require the scale of
a good dragon and the claw of an evil one. The dragons these components are
taken from must be of supreme power, and it will not be an easy task. Good
luck -- if my scrying is correct, you will need it and more."
"""]

