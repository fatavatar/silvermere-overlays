number = 8272
parts = ["""
As you present your bloody trophies to the tiny prisoner, his eyes glint a deep
reddish color as he bows deeply to you. As he straightens again, he begins to
speak, in a tone oddly deep and resounding for one so small.

"Congratulations, you have freed me from the spell Gnaj confined my spirit
 with. I have work to do now, but if you still wish to continue your feeble
 crusade against me, I have my next incarnation selected already. Seek my
 Avatar outside the Ancestral Caves if you value your lives so little, fools!
 Until then, take this -- I like a challenge, and you will be little sport if
 you are slaughtered before we meet again."

As he finishes his declamation, the halfling snatches Gnaj's eyes from your
still-outstretched hand and quickly tosses a small pouch to the ground. It
explodes in a puff of yellowish smoke, which billows up to obscure your vision. As you grope blindly at the floor to discover what the halfling has left, you
hear a diabolical laugh behind you!
"""]

