The imposing-looking dark-elf behind the desk inclines his head for a moment as you approach, and begins to speak even as he continues sorting his papers.

"So, outsiders. It is strange to see one not in the Order here. Are you magi
come to challenge me, or have you come to prove your might against the
abomination in the \u001B[1;32mcaverns\u001B[0;32m below? If you are already of the Order of Crimson
Flame, you may endeavor to cleanse the caverns as a \u001B[1;32mtrial\u001B[0;32m to join the ranks of
the Obsidian Order.""""]

