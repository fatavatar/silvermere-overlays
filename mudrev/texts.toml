The wise woman nods her head slowly, "I thank you for completion of this task,
traveler, and now to business we shall begin." Again the gypsy pauses, and with
a clap of her hands a cloud appears from thin air. Inside the cloud you see a
tumultuous lake, huge waves tossing back and forth. Suddenly an island comes
into view, a creation of horror, and dark island with a fortress of bones
within the center. The gypsy begins her tale, "You are viewing what was the
Crystal Lake, and the island that lies in the center of it. While I still am
researching I have determined the resident within is the source of all our
troubles. The island became inhabited almost a year ago, after the
disappearance of he who was called Valion Darkbane. Events seem to unfold that
show the one called Zanthus is about to return, and the prophecy of plague is
about to occur, most likely at the same time." Without warning the cloud
explodes with a loud flash, the stench of death is thick in the air. You can
tell the woman did not expect this as she rubs her hands in silent agony. "It
would seem my scrying has been caught by our watery neighbor, it is of no
matter. Your next""", """
w is one of peril, but necessary." Another cloud appears and shows a horrific abomination, a massive black tree with humanoid limbs hanging from all branches. "The Hanging Tree as it is called, once it was used for justice, 
but now it has been corrupted, you must slay the creation of evil, and take it's wicked heart from it. I wish only to see it, but you must ultimately take it to the old hermit that guards the library of Arlysia, inside the library you will find more answers. Come back when you have the \u001B[0;1;32mheart\u001B[0;32m." 
The cloud vanishes and she lies back, exhausted from her story.

"""]
