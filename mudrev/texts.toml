[[text]]
link = 0
number = 970
parts = ["""
\u001B[0mThe gnome starts chattering excitedly at your approach.

\u001B[32m"A visitor!" he says, "And just in time! In time for what, you might add? Well,
 watch and see!"

\u001B[37mHe pulls out a large, two-tined fork that glitters in the light. With a
flourish, he points it at a large crystal-studded rock, and the fork begins to
vibrate! The rock shudders and cracks, and then splits into rubble. 


\u001B[0;32m"See? My Titanium Wall-Basher reduces certain types of walls to rubble with no
 more effort than it takes to point. All you have to do is aim, and there you
 go! Very useful for some situations! It only works some places, though. Also,
 I have something else you might like to see!"

\u001B[37mWith that, he pulls on a strange-looking helmet that covers the mouth and nose.
He walks over to the tall glass tank, dives in, and floats down to the bottom.
Bubbles froth out of the piece covering his mouth, and to your astonishment he
begins to talk in a muffled voice!

\u001B[32m"See? I call it the Breathe-Like-A-Fish-Helmet. Or just the Fish Helm for
 short. It has all sorts of uses, and will revolutionize underwater
 exploration! At least it will, when I work out the problems. For some reason,
 it only works in extremely cold waters. Why that is, I have no idea, but it
 works, it works!"

\u001B[37mHe swims to the top of the tank and climbs out, taking the helmet off and
placing on a table.

\u001B[32m"They're so easy to make once you know the trick, so I've made many of them for
 testing purposes. Would you like to try my fine \u001B[1mhelmet\u001B[0;32m, or test out
 one of my blasting \u001B[0;1;32mforks\u001B[0;32m?"
"""]
