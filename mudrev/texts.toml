[[text]]
link = 0
number = 8008
parts = ["""
As you approach him, holding out the flute, Orfeo jumps up in excitement.

"You have returned! I hardly expected you to survive - he was a musical master
nearly as talented as I, if untrained. His powers must grown enormously with
the addition of wizardly magic to his repertoire."

You hand him the flute, and he eagerly motions you to sit down and play with
him. The two of you begin to play, and time ceases for you. Seconds, days,
years later - you do not know, and are not inclined to ask him how long the
lesson took - he leans back with a sigh, his flute again disappearing in a
blink. You stand, stretching your sore legs, as he says, "Use them well - with
great power comes great responsibility, as we all know."
"""]

