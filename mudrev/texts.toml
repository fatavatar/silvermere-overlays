[[text]]
link = 0
number = 9023
parts = ["""
Dhelvanen greets you with a relieved smile. 

"I see I was right about you. You have survived and brought me the stones. Now, at long last, I may know what it is like to stand with the sun on my face 
again."

He immediately begins preparations for the task at hand. Walking all along the 
floor he places a single diamond, eventually you see some sort of mystical 
pattern emerging from the floor, and he then stands in the middle of it. He 
signals for you to be silent as he begins a low hum that rumbles from deep in 
his chest. Finally it seems to become more prominent, and you feel an itching 
behind your ears. The hum turns into a full rumble, and you almost wonder if 
the room is shaking. His eyes light up with power and he raises his hands to 
the ceiling, shouting long gutteral words and phrases. There is a flash, and 
you are almost knocked to the ground by an unseen force. You open your eyes to 
see the mage, looking more haggard then before. With saddened eyes he whispers, "Alas, I have failed, the magic would appear to be too great for me." For a 
moment there is silence and he looks up at you. "But that is still no reason 
for you to lose out on your reward!", he says, handing you a glowing sigil. 

"Rest now and ease your wounds, \u001B[1;32mreturn\u001B[0;32m this to me when you are ready and I 
shall fulfill our agreement." He sits down then and begins to meditate.
"""]
replace = true

[[text]]
link = 0
number = 9024
parts = ["""
Dhelvanen surprises you by throwing his head back and laughing aloud.
"Excellent! You may be the one I have been searching for. I shall prepare the
portal at once." He starts shuffling through his books, looking for something
specific. "The nanati are a secretive race that live on another plane. An
evil people, they dine on the flesh of others...sometimes even their own
kind." He sits up with a book in hand, and looks at you again. "In their
foreheads grow dark stones, rich with magical power. If I had enough of these
stones, I think I may be able to overpower the spell imprisoning me. I will
\u001B[1;32mreward\u001B[0;32m you greatly for bringing 50 of these stones back to me. Just tell me
when you are \u001B[1;32mready\u001B[0;32m to go and I shall open the portal. The wards that keep me
bound to this room will prevent my physical form from entering the portal, but
you will be free to go." He sighs and sits back down.
"""]
