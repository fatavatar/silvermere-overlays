[[text]]
link = 0
number = 8119
parts = ["""
You tell Balthazar of the Enchantress' agreement to a temporary alliance, and
also mention the conflict between your new ally and her agent, the Astromancer, knowing this will please him.
\u001B[s

"Good, good, this is all good. I do wish Raeanna would have agreed to a full
alliance, as then she would not be watching later on, when we must dispose of
her. No matter, though, she can wait for later. For now, it is good to hear of
the corruption of the forest, and even better to know Raeanna also has a
conflict with her own servants awaiting her. You have done well, and I suppose
I should reward you. Take this trinket - it is of no use to me, but you may be
able to do something with it."
\u001B[s

Balthazar makes a sharp gesture, and the floor vanishes in front of you,
leaving only a circle of blackness. A dark black chest slowly rises out of the
hole in the floor, until it is hovering almost a foot in the air. Balthazar
then gestures again, and the chest is on the ground before you, the hole filled as if it had never been.\u001B[s

\u001B[0;36mYou gain 1,000,000,000 experience for completing this quest!
"""]

[[text]]
link = 0
number = 8120
parts = ["""
Annora looks up distractedly as you make your presence known. Her fingers
describe a staccato beat on the desk before her, the first real sign of nerves
you have seen from this remarkable woman, as she says simply, "I have again
received word from the King of Nazareen. Go to him and find out what \u001B[1;32mtask\u001B[0;32m he
has for you this time, as Nazareen is and has long been a bastion against evil. We must do whatever is necessary to preserve it as such. I wish I could devote
more attention to this matter, but I have recently come to suspect that someone
in my confidence has betrayed the cause. Naturally, I must see to our safety
first by ensuring this traitor is banished."
"""]

