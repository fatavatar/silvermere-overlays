[[text]]
link = 0
number = 7001
parts = ["""
The elderly sage eyes you slowly, and waits patiently for his turn to speak.

He says "\u001B[0;36mFor I am the last of the elemental overlords, and I
am the only person who contains the power to conjure a magical
ring that will help you in your journey.  If ye wish to bring 
me the primary component, I shall forge you this supreme ring.
It is known that a deep cavern exists below the elemental forest
that lay west of Nazareen.  Return to me this mysterious stone,
The \u001B[1;36mE\u001B[0;31ml\u001B[0;36me\u001B[0;35mm\u001B[1;32me\u001B[1;35mn\u001B[1;33mt\u001B[1;37ma\u001B[0;32ml\u001B[0;36m \u001B[1;34mShard\u001B[0;36m that lay deep within the caves of \u001B[1;32mElements.\u001B[0;36m 
Go now, journey into the heart of this chaotic unbalance of elements."

\u001B[0;32mYou walk away in interest, wondering what the true power of this ring holds.
The excitement of the unknown entices you to embark on a quest for answers!"""]

[[text]]
link = 0
number = 7002
parts = ["""
The sage exclaims \u001B[0;36m"The primary component can be found in the far
northwest part of the elemental forest. You will find a deep
cavern here. It leads downward for many steps, and is quite
treacherous. You will encounter a number of elemental creatures,
some more feracious than others. \u001B[1;32mReturn\u001B[0;36m to me the Shard found at
the bottom of the deep caves.""""]

