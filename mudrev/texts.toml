[[text]]
link = 0
number = 8116
parts = ["""
Balthazar glares at you icily before beginning to speak.

"How nice of you to join me. Not a moment too soon, for as you should have
known by now, the defeat of Zanthus has forced open the portals created by the
great mage Morukai. The city of Nazareen lies open for conquest, and you have
been absent for quite long enough. Your services are required. NOW. I need you
to travel to Nazareen and speak to the sorceress Raeanna, who calls herself the Demonic Enchantress now. When I knew her she was dedicated to good, and was one of my greatest rivals. Now that she has realized her full potential and turned
to the Dark, she will make a useful ally. You must secure this \u001B[1;32malliance\u001B[0;32m. Return when the \u001B[1;32mdeed\u001B[0;32m is complete and you have achieved an alliance with Yasmina, and
not before. If you return quickly, I may even have a reward for you."

As you turn to leave, Balthazar languidly speaks once more, "Oh yes, you might
want to take this token so she knows I have sent you, and does not slaughter
you out of hand," and holds out a small yellowish bracelet which you quickly
turn and grab.
"""]

[[text]]
