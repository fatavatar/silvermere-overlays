[[text]]
link = 0
number = 7999
parts = ["""
"Travelers from all around have been waylaid lately. I think most of it is the 
work of our court wizard, \u001B[1;32mZedwic\u001B[0;32m, who recently fled and has reportedly made 
his lair just southeast of the city, taking refuge behind his personal guard 
of demonic spiders. Since he vanished from our castle several weeks ago, there 
has been a plague of monsters encroaching upon our very gates. There are 
strange pink rabbits beyond the west gates, and I myself saw a guardsman killed where he stood, even as he unsheathed his sword. To the east, the rosebushes my gardener was cultivating along the path have all turned black and begun 
attacking people. To the south, an evil sorceress whom Zedwic spurned years ago
has been building her forces ever since. I can only hope that they do not join forces!"

The King loses his composure again, sending plates and mugs flying with a 
mighty blow of his fist. You step back, hoping he does not become more 
violent, but he quickly calms down again.

"As if this were not enough, I have heard rumors of Zedwic's armies, and he is 
said to have established a training camp of dragoons and an aerie of wyverns 
for his servants. Indeed, I am surprised they have not attacked already! 
The forest to the west seems also to have been going through some changes. The 
earth itself has been churning beneath it, and the trees constantly look like 
they are ablaze."""]

[[text]]
link = 8001
number = 8000
parts = ["""
Orfeo grins, becoming more animated by the moment. He stands suddenly and
says, "These songs were not easy to \u001B[1;32mlearn\u001B[0;32m, and I would be happy to perform
for you.  Just give me a moment..."

He produces a beautiful platinum flute, apparently from nowhere, with the
merest flicker of his hand.  Raising it to his lips, he begins playing a
vibrant melody which seems to resonate physically through the room, causing the air to ripple around you.  You jump as you begin to feel energy coursing around you, swirling in a pattern which is fascinating and at the same time
frightening to feel...
"""]

