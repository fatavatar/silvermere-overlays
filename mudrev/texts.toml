\u001B[0mThe Timelord greets you warmly, saying:

\u001B[0;32m"Welcome, young one. It has been quite some time since I have had the pleasure
 of a mortal's company. Five hundred years, in fact -- ever since the end of
 the last Great War. The lieutenants of the Host of Darkness, those that you
 would name fallen angels, captured me in a desperate, last-ditch effort as the
 forces of light were already proclaiming their victory. In their triumph
 they failed to see the dark forces overwhelm my sanctuary and capture me. The
 power of their confinement means that even now, it is impossible for me to
