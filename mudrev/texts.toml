parts = ["""
As you approach him, Balthazar seems quite intent on something small and dark
in his hand, and is muttering under his breath. You speak and he jumps up, his
hands held forth as if ready to blast you where you stand. Relaxing as he
recognizes you, he scowls and says, "Raeanna is becoming quite a nuisance. She
has the audacity to send a message requesting your services again - nearly
demanding it! This time, I will let her disrespect go unpunished, but next
time..." Balthazar grins evilly, causing the light to refract blindingly off
his fangs. "You shall return to the Demonic Enchantress once more and present
your services for whatever \u001B[1;32mtask\u001B[0;32m she may require of you. Go, and watch for any
signs of betrayal in her."
"""]

