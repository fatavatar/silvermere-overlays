[[text]]
link = 0
number = 1459
parts = ["""
\u001B[0;1;33mYou grasp the golden egg firmly, and hurl it out over the lake of fire 
with all of your might. As it plunges towards the lake's burning surface, the 
egg begins to glow with a flickering white aura. Striking the fiery magma, it 
explodes in a flash of golden light!

Out the burning lake streaks forth an achingly beautiful form, as brilliant as
the stars and swift as the wind. Flying up out of the flames, the Phoenix,
reborn, lands on the edge of the ledge. With a gaze both tender and terrible,
you suddenly understand the legendary creature's thoughts-- that you have 
the thanks and everlasting friendship of this beautiful being, and that you 
will never be forgotten for your service.

With a flashing leap, the Phoenix surges into the air once more, circling over
you slowly. A glowing, fluttering object-- a feather-- floats down from her
wing and lands at your feet, and then, abruptly, she is gone in a streak of
flame.

\u001B[0;36m<You gain 3,000,000 exp for freeing the Phoenix from imprisonment!>
"""]
