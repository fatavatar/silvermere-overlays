number = 8249
parts = ["""

"The dragon that ended my life, in my time young and inexperienced, has
advanced sufficiently in its arts that it was able to conceal its lair against
the scrying of Morukai after the Great War, by shifting its very existance into
the negative plane. To you, mortal, the entrance to the lair will be
completely hidden from sight, but with my direction it will be easy to find.
Simply follow these caverns back to the northwest until the path goes up an
incline, then curves back around to the south. When you think you have reached
an impassable wall, you have reached the entrance. The southeast wall,
specifically, is an illusion projected by the dragon to ensure none remember
its existance. Simply walk through, and you will be transported to the lair. If
you do slay the beast, bring me a \u001B[1;32mtoken\u001B[0;32m and I will reward you with a trinket
from the collection brought by the vermin I control."
"""]

