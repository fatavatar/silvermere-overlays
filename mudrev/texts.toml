[[text]]
link = 0
number = 4068
parts = ["""
With the agility of his race he awakens and clutches your hand, a growl escaping his lips. Gazing at you harshly he says, "If you are not an illusion give to me now what the nomad gave to you!" Without a word you hand him the small vial, he takes it from you, gazing at it for a few moments. Then in one sudden action he downs the vial, and lies back against the wall. He then unravels his clothed item and reveals a bright blue blade, that shines with magical power. He lays it on the floor and gestures for you to take it.
Whispering he says "The vial given to me will heal my internal wounds, allowing me some comfort in this cold prison. I do not expect I can escape the magics of the rakshasha, so to you I leave this sword, it has served me well and may it do the same for you." He then closes his eyes, and sounds as if he were resting peacefully.

"""]
replace = true

