[[text]]
link = 0
number = 8167
parts = ["""
You toss the heavy claw down upon his desk, and the dark-elf's face lights up
momentarily with a smile. He stands up to clasp your hand, and you gasp at the
strength of his grip. Looking at him again, you realize he is even smaller than he seemed seated, and your mind boggles at the strength packed in that wiry
frame. In a quiet voice he says,

"It has been long since I have welcomed another brother into the Order, so you
will forgive me if the ceremony is not exactly up to par. In the name of Grand
Inquisitor Dulram and the High Council of Inquisitors, I welcome you into the
Obsidian Order and confirm your rank as a Demonslayer. Take this to commemorate your service and our brotherhood, and continue your good work as a mageslayer."

He claps you on the shoulder, making you stumble, and presses a small object
into your hand before sitting again.
"""]

