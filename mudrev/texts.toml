[[text]]
link = 0
number = 489
parts = ["""
\u001B[0;0mBalthazar's wide toothy smile is both gratifying and unsettling.\u001B[s

\u001B[0;32m"Well done!", he exclaims, "I wasn't sure you could even find the place. Once 
again, you have not let me down. This bodes well for you, as failure is heavily punished, and success well rewarded. Now that you have proven yourself somewhat worthy of some minor trust, perhaps I can repay that faithfulness with a bit - 
just a BIT - of the power I enjoy."\u001B[s

\u001B[0;0mBalthazar stands, walks over to you, and lays his hand on your head. You fall 
to your knees, helpless under his power. He begins a slow chant, which steadily increases in power and speed, until he is practically screaming the arcane 
words in a resounding voice which makes your teeth grind!

\u001B[0;31mBalthazar's hand begins to glow and heat, and a red haze replaces your vision. 
You feel the rage of a thousand murders screaming through your veins! As the 
last vestige of rational thought is annihilated, you begin to lose track of 
time, place, even who you are...\u001B[s

\u001B[0;36mYou gain 4,000,000 experience!

\u001B[0;32mWhen you open your eyes again, Balthazar is back behind his desk, staring at 
you through lazy eyes. He grins at your expression and says, "Oh, that was just a little test. I showed you a small glimpse of the true power of raw Evil 
just then. As it did not destroy you utterly, you may be worth the time to 
train. That stone in your hand," at which you look down in bewilderment and 
notice a small red stone in the palm of your raw, bloody hand, "will be an 
eternal connection to the Darkness for you, and will also serve to increase 
your maximum damage and armour class."
"""]
replace = true

