[[text]]
link = 0
number = 4294
parts = ["""
Finally the Spacelord nods and continues, "Indeed, you have already met the
pawn of your enemy. Long before Zanthus ever discovered his research, a
renowned mage by the name of Helvectus was researching the creation of liches,
trying to formulate a working method to attain immortality. Although he did not
himself succeed, he left his essence trapped in a large black diamond which was
kept for him by his ally Ozrinom in case a mage great enough to attempt the
rite of immortality came into power. When Zanthus attempted the rite, even in
his success the spirit of Helvectus was released again. He has allied himself
with an ancient golem maker, Gnaj the Creator, in hopes of again acquiring a
physical body. If you wish to preserve your realm from chaos and utter
destruction as Zanthus and Helvectus clash, you must seek out the \u001B[1;32mTimelord\u001B[0;32m for
more information."
"""]
