parts = ["""
The Overlord glares up at you as you cautiously approach, fearing some sort
of trickery. His once-proud face is now contorted with pain and anger, and he
hisses in pain with each labored breath he takes. You reach the spot where he
lies and ready yourself to deliver the coup de grace.

Just as you are about to strike, he draws himself and begins to speak:

 "Although I despise you for what you have done to me, I cannot let all my hard
work crumble like this - since there is no other, I will pass on my secret
skills in walking the \u001B[1;32mshadows\u001B[0;32m. Use them well, and gather together my minions
to continue my work!"
"""]

