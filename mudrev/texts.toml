slightly in recognition. He begins to speak again in an echoing voice:

"So, my brother has also felt the stirring of Helvectus' spirit. As you mortals
 reckon things, Helvectus' spirit has only recently surfaced again, and my
 brother has not the power to pierce the veil of time. The golem maker of whom
 you speak is ancient beyond mortal ken, and largely forgotten. He dwells deep
 beneath the dwarven mines of Khazarad, practicing his art. Gnaj has always
 been neutral, even in the Chaos Wars, but something Helvectus offered him has
 caught his fancy -- something which is able to cloud even my sight."
