parts = ["""
Orfeo smiles slightly, saying, "Welcome to my inn, wanderer. For a modest 
price, you may rest upstairs, or have a warm meal. Ale and wine are available
if you so choose. For the musically inclined, I have a selection of fine
instruments for sale, or I could play a \u001B[1;32mmadrigal\u001B[0;32m for you. By the way, there are bandits patrolling south of the swamp, and packs of wild dogs to the north. The northern route is longer, but easier. The gypsies across the road are friendly 
