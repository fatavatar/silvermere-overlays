[[text]]
link = 0
number = 2948
parts = ["""
Aldreth glances at you and says, "Indeed, thou might be powerful enough to
pass the test I have." He pauses for a moment then continues, "Very well, deep
inside the dark cave that is in this forest, thou wilt find many goblins and
orcs. Halfway through thou wilst find a trapdoor that will take thee to a
pen of pitiful kobold slaves. At the end of the pen is a cruel lord over
these pathetic slaves, and through his throne thou wilt find a massive cavern
full of orcs that have been training and preparing for a grand invasion of
the forest, nay even Silvermere." He pauses for a moment, allowing you to take 
in the gravity of the situation, then continues. "I charge thee, adventurer, to
go to this great training area, and collect from there fifty orcish HEADS.
Completing this task will prove thee worthy of the combat manuevers used by
warriors of legend." He goes back to his normal stance, and says
"Return to me when thou hast the heads, until then I bid thee good fortune."
"""]
replace = true

[[text]]
link = 2950
number = 2949
parts = ["""
Aldreth smiles and says, "Indeed thou hast passed the test to prove thy worth,
now let me pass on one of the secrets of combat that I have carried with me."

He leans forward and gestures for you to do the same, his voice whispers into
your ear, "There is a technique many great warriors used to attack a foe by
using their weight to force the opponent to the ground, it is a very powerful
single blow, and not only is the damage great but the chance to SMASH a foe 
and knock them down is great as well. Let me give thee an example!"

Before you know it you are on your back staring up at the grinning face of 
the old warrior. He gestures for you to get up and practices with you some
more, as you begin to think you're getting the hang of it he claps his hand
on your back and says, "Indeed thou hast mastered this form of combat, I pray
thou use it in good faith and may thy battles be won!" With that he waves
goodbye to you.
"""]
replace = true

