[help_change.was]
text = """

The custom statline is set by typing SET STATLINE CUSTOM xxx or
SET STATLINE FULL CUSTOM xxx.  If you choose the FULL option then pressing
Enter will display the same room information as the FULL statline.  
The xxx can be up to 60 characters long and may include spaces, etc.
You may include the following variables in xxx:
      %%h - current hit points
      %%H - max hit points
      %%m - current mana
      %%M - max mana
      %%c - current wealth on hand
      %%x - current experience
      %%X - experience to next level
      %%r - resting flag " (Resting) " when resting
      %%fn - set foreground colour (n = 0-7)
      %%bn - set background colour (n = 0-7)
      %%B - bold
      %%N - normal
      %%U - underline
      %%L - blink
      %%R - reverse
      %%d - use default colours
      %%n - line-break
      %%w - warning flag
"""

