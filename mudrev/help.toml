\u001B[34m╔═══════════════════════════════════════════════════════════════════════════╗
║ \u001B[1;33mSHAMANS                                                         \u001B[37mEXP: \u001B[0m200% \u001B[34m║
╠═══════════════════════════════════════════════════════════════════════════╣
║ \u001B[37mShamans are similar to Druids in their dedication to nature and their     \u001B[34m║
║ \u001B[37mmastery of elemental spells. However, Shamans command far more formidable \u001B[34m║
║ \u001B[37moffensive magics than Druids, and are somewhat less versatile in their    \u001B[34m║
║ \u001B[37mutility spells. To allow them more control over their magics, they will   \u001B[34m║
║ \u001B[37mwear no armor heavier than robes, and receive no training in weapons.     \u001B[34m║
║ \u001B[37mShamans are more likely to be found far from civilization, or in a        \u001B[34m║
║ \u001B[37mposition of power over primitive peoples, while Druids are typically      \u001B[34m║
║ \u001B[37mfound in and around cities working to preserve the environment.           \u001B[34m║
║ \u001B[37mAlthough Shamans start out with relatively weak magic, as their training  \u001B[34m║
║ \u001B[37mprogresses their powers become more and more formidable. At the height    \u001B[34m║
║ \u001B[37mof their powers, a Shaman may easily match the magic of most Wizards.     \u001B[34m║
╠═══════════════════════════════════════════════════════════════════════════╣
║ \u001B[37mHP/Level: \u001B[1m3-6  \u001B[0mMagic: \u001B[1mShaman-3 \u001B[0mCombat: \u001B[1m1  \u001B[0mWeapons: \u001B[1mStaff \u001B[0mArmour: \u001B[1mRobes    \u001B[0;34m║
╠═══════════════════════════════════════════════════════════════════════════╣
║ \u001B[37mAbilities: \u001B[1mNone.                                                          \u001B[0;34m║
╚═══════════════════════════════════════════════════════════════════════════╝
"""
words = "shamans"

[help_change.was]
text = """

The SET KEEP command has the following optional forms:

SET KEEP -- Will toggle the keeping of some experience after your final death
SET KEEP OFF -- Will disable the keeping of some experience after final death
SET KEEP ON  -- Will enable the keeping of some experience after final death

With KEEP mode 'on', when you reroll or die your final death and create a
new character, your new character will start with some of the experience
which you created in your original character.
"""
words = "Keep Set Keep"

