be back at the main menu. Then enter MajorMUD once more to complete the change
and to change your stats.

The time you have to change your race wil be displayed on the main menu beside
the ChangeRace menu command. The amount shown is the time your have, in
\u001B[1mGAME MINUTES\u001B[0m, before you no longer have the option of changing your race. You
may change race any number of times during that period. Note that the time you
are allowed does not tick down while you are not in the game-- it only gets
used up while you are in MajorMUD playing, not while you are at the main menu
or while logged off. A good use of this time is to try out a new race, test it
to see if you like it, if its EXP chart is too high for you, and if it just
"feels right". If you don't like it then you can simply change. But keep an eye
on the time!

