land you stand on. Surrounded by ink black water, the tide thrashes
about, ready to devour you, plunge you into its dusky dephts. Shadows
dance about your feet, twisted and nightmarish, you realize the shadow
comes from you, but warped in a sick, bestial form. No immediate path
back, and for the moment you seem stranded on this shadow land."""
