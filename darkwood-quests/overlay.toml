[[news]]
date = "2026-11-09"
kind = "new"
title = "Past the seventh trial"
text = """
Those who walked the alignment quests to their seventh end were told it was the last. It wasn't.

At level 150 the road goes on, through a grey gate and into halls where giants once worked \
metal that fell from the sky. At level 200 a mirror shows a throne room that no one has entered \
in a very long time."""
