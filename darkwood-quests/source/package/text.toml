# Quest conversations (drafted; the MDB has no prose). Markup: {k}word{/k} = keyword,
# {hint}...{/hint} = goal line, {exp} = the experience line.

[[text]]
number = 9707
called_from = "Textblock #9706"
text = """
The gaunt one weaver sets down the shimmering cloth in his long fingers and
regards you without expression. "Few travel this deep into the Dreary Forest by
choice. If you have come about the one who dwells beyond these trees, you have
come about {k}Magnus{/k}. Every power in the realm has begun to stir against him: the
champions of the {k}good{/k}, the keepers of the {k}balance{/k}, even the servants of {k}evil{/k}.
Tell me which you serve, and I will tell you what I know."
"""

[[text]]
number = 9709
called_from = "Textblock #9708"
text = """
As the Onyx Juggernaut crashes to the ground, its diamond eyes crack and go
dark. A thin purple mist seeps from its shattered chest and drifts away into
the forest, and you feel something vast and distant flinch.

{hint}<Seek out Lord Magnus in his hut in the Dreary Forest, and destroy him!>{/hint}
"""

[[text]]
number = 9711
called_from = "Textblock #9710"
text = """
Lord Magnus shrieks, its tentacles writhing as the symbols on its robes flicker
and die. A wave of force slams through your skull, then silence. Slowly, the
forest around you seems to breathe again.

{hint}<Return to your quest leader and tell them of {k}Magnus{/k}' fall!>{/hint}
"""

[[text]]
number = 9712
called_from = "Textblock #9706"
text = """
The weaver's long face darkens. "Lord Magnus is lord of no land you know. He
came through one of Morukai's portals when they woke again; a thing from beyond
the stars, purple-skinned and tentacled, that feeds upon minds. For years he
has bound the strongest creatures of the realm to his will. Dragons, demons,
the Onyx Juggernaut itself... each bears his mark, and each lends its strength
to the shield that guards him."

He lowers his eyes to the cloth in his hands. "I was once his weaver. I spun
the robes that drink the light. Destroy his servants, and his shield will
crumble. I will help you undo what I helped to make."
"""

[[text]]
number = 9719
called_from = "Textblock #9718"
text = """
A pair of royal guards step out of the shadows and seize you by the arms. "By
order of the King, no agent of Silvermere sets foot in these halls," one of
them growls. Before you can protest, they march you back to the castle gates
and shove you out into the courtyard.

{hint}<You must reach the King another way. Perhaps through the guard tower...>{/hint}
"""

[[text]]
number = 10004
called_from = "Textblock #495"
text = """
Chancellor Annora sets aside a stack of reports and rubs her eyes. "With
Zanthus weakened, a new shadow has fallen over the realm. Our seers speak of a
creature called Magnus, gathering the strongest beasts of the land beneath his
banner, and the temple wards in Southwind Dale have begun to fail one by one.
Go to the Southwind Dale Temple and speak with High Priest Annora, my namesake
and the wisest servant of the Light I know. Ask her about the temple's
{k}protection{/k}."
"""

[[text]]
number = 10006
called_from = "Textblock #10005"
text = """
High Priest Annora rises from her prayers and greets you with a tired smile.
"Welcome, child of the Light. Dark days are upon us. The temple's {k}protection{/k} is
failing, an {k}angel{/k} has fallen into darkness, and there is a corruption in this
land that we must {k}eradicate{/k}. If the Chancellor has sent you, you are doubly
welcome here."
"""

[[text]]
number = 10007
called_from = "Textblock #10005"
text = """
High Priest Annora's face grows grave. "The wards of this temple were sung into
being by the angels themselves, long ago. One of those angels has fallen. It
has taken a demonic shape and lairs in the caves of the Dark Jungle, and every
day it lives, it drains the strength of our wards. It must be destroyed."
"""

[[text]]
number = 10009
called_from = "Textblock #10008"
text = """
Annora lays a cool hand on your brow and murmurs a blessing. "Go with the
Light, and do not let its false radiance deceive you."

{hint}<Slay the Demonic Angel in the caves of the Dark Jungle!>{/hint}
"""

[[text]]
number = 10011
called_from = "Textblock #10010"
text = """
As the Demonic Angel falls, its black wings crumble into ash, and for a single
moment you glimpse the shining being it once was. Its last words are a whisper:
"Athos... he made me this..." Then it is gone.

{hint}<Return to High Priest Annora and tell her of the fallen {k}angel{/k}!>{/hint}
"""

[[text]]
number = 10012
called_from = "Textblock #10005"
text = """
Annora closes her eyes. "So it is done, and the poor creature is at peace. But
it spoke of Athos? Athos was a warlord of the old kingdom who sold his soul for
undying life. He rules still from the throne room of an ancient castle high in
the mountains, and if he could corrupt an angel, he will not stop there."
"""

[[text]]
number = 10014
called_from = "Textblock #10013"
text = """
"Seek him out and end him, and the corruption with him."

{hint}<Slay Athos in the throne room of the Ancient Castle!>{/hint}
"""

[[text]]
number = 10016
called_from = "Textblock #10015"
text = """
Athos staggers back against his throne, his ancient armour splitting apart.
"You are... too late," he rasps. "Magnus has what he needs. My part is...
done." With a final, rattling breath, he collapses into dust.

{hint}<Return to High Priest Annora so that she may {k}eradicate{/k} what remains of his
corruption!>{/hint}
"""

[[text]]
number = 10017
called_from = "Textblock #10005"
text = """
Annora listens to your tale in silence, then leads you to the high altar.
"Athos is gone, but his corruption lingers in the stones of this land. Kneel,
and let us eradicate it together." She begins to chant, and a pure white light
gathers around the altar.
"""

[[text]]
number = 10019
called_from = "Textblock #10018"
text = """
The light flows outward through the temple, and you feel the old wards hum back
into life. Annora smiles wearily. "It is done. The temple's protection is
restored. Return to the Chancellor and tell her so, and tell her the name Athos
spoke. Magnus."

{hint}<Return to Chancellor Annora and report on the temple's {k}protection{/k}!>{/hint}
"""

[[text]]
number = 10020
called_from = "Textblock #335"
text = """
Chancellor Annora listens intently as you tell her of the fallen angel, of
Athos, and of the temple's restored wards. "You have done well, and the people
of Southwind Dale will sleep safer for it. But Magnus... that name troubles
me."
"""

[[text]]
number = 10022
called_from = "Textblock #10021"
text = """
Annora takes a crystal phial from her desk and pours its glowing contents over
your head. Rather than wetting you, the light gathers above your shoulders into
a soft golden halo. "Wear this Aura of Light with pride. It marks you as a true
champion of the Light. When you have grown stronger, come to me for further
{k}missions{/k}."

{exp}
"""

[[text]]
number = 10023
called_from = "Textblock #506"
text = """
The Grey Lord's eyes fix upon you, and his thoughts echo in your mind:

<A new force disturbs the balance. A creature called Magnus gathers beasts and
monsters to his will. Seek the starmetal giant king, who rules the pinnacle of
Gloomy Mountain; the giants have long kept the balance in the high places. Ask
him of {k}protection{/k}.>
"""

[[text]]
number = 10025
called_from = "Textblock #10024"
text = """
The starmetal giant king looks down at you from his great height, his voice
rumbling like distant thunder. "Small one. You climb far to stand before me. If
the Grey Lord sent you, speak. My people seek {k}protection{/k} from a {k}dragon{/k}, and
from a {k}monster{/k} that was once our own."
"""

[[text]]
number = 10026
called_from = "Textblock #10024"
text = """
The giant king strokes his silver beard. "For a thousand years the giants have
kept the balance in the high places. Now an Ancient Dragon has woken in the
caves of the Dark Jungle, and it raids our herds and burns our watchfires. It
bears a strange mark upon its scales, a purple sigil. Kill it."
"""

[[text]]
number = 10028
called_from = "Textblock #10027"
text = """
The giant king nods gravely.

{hint}<Slay the Ancient Dragon in the caves of the Dark Jungle!>{/hint}
"""

[[text]]
number = 10030
called_from = "Textblock #10029"
text = """
The Ancient Dragon thrashes once more, then lies still. Upon its scales you
find the sigil the giant king spoke of: a purple mark like a coiled tentacle,
already fading.

{hint}<Return to the starmetal giant king and tell him of the {k}dragon{/k}!>{/hint}
"""

[[text]]
number = 10031
called_from = "Textblock #10024"
text = """
The giant king's eyes narrow. "The same mark? Then the dragon was no wild
beast, but a servant. There is another who bears that sign: Atlas, the titan
who has made his throne in the Ancient Cave beneath our mountain. He was once
our brother. Now he is a monster."
"""

[[text]]
number = 10033
called_from = "Textblock #10032"
text = """
{hint}<Slay Atlas upon his throne in the Ancient Cave!>{/hint}
"""

[[text]]
number = 10035
called_from = "Textblock #10034"
text = """
Atlas topples from his throne with a crash that shakes the cave. As he dies his
eyes clear, and for a moment he looks almost grateful. "Tell my brother... the
purple one... Magnus... he took my mind."

{hint}<Return to the starmetal giant king and tell him the {k}monster{/k} is slain!>{/hint}
"""

[[text]]
number = 10036
called_from = "Textblock #10024"
text = """
The giant king bows his great head. "Atlas was my brother. You have freed him,
and our mountain is safe once more."
"""

[[text]]
number = 10038
called_from = "Textblock #10037"
text = """
"Return to the Grey Lord and tell him the balance of the high places is
restored. And tell him the name my brother spoke."

{hint}<Return to the Grey Lord and speak of the {k}balance{/k}!>{/hint}
"""

[[text]]
number = 10039
called_from = "Textblock #366"
text = """
The Grey Lord's piercing eyes seem to open your soul, and his thoughts echo in
your mind:

<The giants are at peace, and the balance holds... for now. But Magnus is a
greater threat than I knew.>
"""

[[text]]
number = 10041
called_from = "Textblock #10040"
text = """
<For your service, accept this.> A tiny set of silver scales shimmers into
being in the air beside you. <The Scales of Balance. Let them remind you that
every force must have its counter. When you have grown stronger, return to me
for further {k}missions{/k}.>

{exp}
"""

[[text]]
number = 10042
called_from = "Textblock #431"
text = """
Balthazar drums his clawed fingers on the desk. "There is a newcomer who thinks
he can carve out his own little kingdom in my realm. Magnus, he calls himself.
I do not tolerate competition. Go to the Ivory Tower and present yourself to
the Enigma Master; his interests align with mine, for now. Offer him your
{k}service{/k}."
"""

[[text]]
number = 10044
called_from = "Textblock #10043"
text = """
The Enigma Master looks down at you with eyes like coal, his impossibly long
fingers steepled. "Balthazar's lackey. How quaint. If you are here to offer
your {k}service{/k}, I have uses for you. There is an {k}angel{/k} that needs breaking, and a
king of {k}starmetal{/k} whose crown I desire."
"""

[[text]]
number = 10045
called_from = "Textblock #10043"
text = """
The Enigma Master smiles thinly. "In the Dark Jungle lurks a creature called
the Angelic Demon: a demon that wears the shape of an angel, and serves Magnus.
It also guards something I want. Kill it."
"""

[[text]]
number = 10047
called_from = "Textblock #10046"
text = """
{hint}<Slay the Angelic Demon in the Dark Jungle!>{/hint}
"""

[[text]]
number = 10049
called_from = "Textblock #10048"
text = """
The Angelic Demon screams as its stolen radiance is torn away, revealing the
twisted demon beneath. It collapses into a heap of black feathers and smoking
ash.

{hint}<Return to the Enigma Master and tell him of the {k}angel{/k}!>{/hint}
"""

[[text]]
number = 10050
called_from = "Textblock #10043"
text = """
The Enigma Master laughs, a dry, rattling sound. "Excellent. You are more
useful than you look. Here, a token of my appreciation."
"""

[[text]]
number = 10052
called_from = "Textblock #10051"
text = """
He tosses you a heavy pouch of platinum. "Now, the giants of Gloomy Mountain.
Their king wears a crown of glowing starmetal, and he has foolishly sided
against Magnus, which means he will soon side against us. Kill him, and bring
me news."

{hint}<Slay the starmetal giant king on the pinnacle of Gloomy Mountain!>{/hint}
"""

[[text]]
number = 10054
called_from = "Textblock #10053"
text = """
The starmetal giant king crashes to the ground like a falling mountain. His
crown of glowing metal rolls to a stop at your feet, its light slowly dimming.

{hint}<Return to the Enigma Master and speak of the {k}starmetal{/k}!>{/hint}
"""

[[text]]
number = 10055
called_from = "Textblock #10043"
text = """
The Enigma Master's coal-black eyes gleam. "The giant king is dead? Then the
mountain is open to us... and to Magnus, for now."
"""

[[text]]
number = 10057
called_from = "Textblock #10056"
text = """
"Our arrangement is complete. Return to Balthazar and tell him his {k}monopoly{/k} on
the high places is secure. He will be pleased, for a change."

{hint}<Return to Balthazar and speak of his {k}monopoly{/k}!>{/hint}
"""

[[text]]
number = 10058
called_from = "Textblock #428"
text = """
Balthazar leans back in his chair, a slow smile spreading across his face. "So
the giants are broken, and the Enigma Master owes me a favour. You have done
well, for once."
"""

[[text]]
number = 10060
called_from = "Textblock #10059"
text = """
He snaps his fingers, and a small black icon shaped like a grinning horned
skull appears in the air beside you. "The Icon of Evil. Carry it, and let all
who see it know whom you serve. Come back when you are stronger; I will have
more {k}work{/k} for you."

{exp}
"""

[[text]]
number = 10061
called_from = "Textblock #506"
text = """
The Grey Lord's thoughts echo in your mind:

<Magnus' servants spread chaos through the forests. The Acid Beast that prowls
the clearing in the Darkened Forest is his creature, and its poison spreads
with every day. Destroy it.>

{hint}<Slay the Acid Beast in the clearing of the Darkened Forest!>{/hint}
"""

[[text]]
number = 10063
called_from = "Textblock #10062"
text = """
The Acid Beast dissolves into a hissing pool of green slime that slowly sinks
into the earth. The stench lingers long after it is gone.

{hint}<Seek out the gaunt one weaver in the Dreary Forest, and ask how to restore the
{k}balance{/k}!>{/hint}
"""

[[text]]
number = 10064
called_from = "Textblock #9706"
text = """
The weaver nods slowly. "A keeper of the balance. Then you understand that
Magnus cannot simply be overpowered; his strength must be turned against him.
Deep in the Ancestral Cave dwells the Ancient Phantasm, a spirit of mist and
poison that Magnus has bound to his service."
"""

[[text]]
number = 10066
called_from = "Textblock #10065"
text = """
"Destroy it, and bring me word."

{hint}<Slay the Ancient Phantasm in the Ancestral Cave!>{/hint}
"""

[[text]]
number = 10068
called_from = "Textblock #10067"
text = """
The Ancient Phantasm lets out a long, thin wail and bursts into a cloud of
acrid green gas. You stagger back, coughing, as the vapour settles into the
corners of the cave.

{hint}<Return to the gaunt one weaver and tell him of the {k}gas{/k}!>{/hint}
"""

[[text]]
number = 10069
called_from = "Textblock #9706"
text = """
The weaver's eyes light up. "The phantasm's essence! Some of it drifted this
way on the wind, and I gathered what I could... here."
"""

[[text]]
number = 10071
called_from = "Textblock #10070"
text = """
He hands you a glass globe of bubbling green liquid. "Hurl this at Magnus when
you face him. It will burn through his defences like nothing else. But first,
his last guardian must fall: the Onyx Juggernaut, in the Ancestral Cave."

{hint}<Slay the Onyx Juggernaut in the Ancestral Cave!>{/hint}
"""

[[text]]
number = 10072
called_from = "Textblock #366"
text = """
The Grey Lord rises, and his thoughts fill your mind:

<Magnus is no more. The balance is restored, and the forces of chaos have lost
a powerful ally.>
"""

[[text]]
number = 10074
called_from = "Textblock #10073"
text = """
The scales at your side flare gold and silver, and grow heavier and brighter.
<Your Scales of Balance are made whole. Call upon them, and they will restore
clarity to a mind clouded by chaos.>

{exp}
"""

[[text]]
number = 10075
called_from = "Textblock #431"
text = """
Balthazar's fangs glint as he speaks. "Raeanna has finally overstepped her
bounds. My spies tell me she has made a pact with Magnus. The Demonic
Enchantress dies today. Go to the Darkened Forest and see to it personally."

{hint}<Slay the Demonic Enchantress in the Darkened Forest!>{/hint}
"""

[[text]]
number = 10077
called_from = "Textblock #10076"
text = """
The Demonic Enchantress shrieks a curse as she falls, her beautiful face
twisting into something hideous. "Magnus will... avenge me..." With a final
crackle of dark energy, her body crumbles into ash.

{hint}<Seek out the gaunt one weaver in the Dreary Forest, and tell him you serve
{k}evil{/k}!>{/hint}
"""

[[text]]
number = 10078
called_from = "Textblock #9706"
text = """
The weaver studies you with open distaste, but nods. "Even the darkness has
reason to fear Magnus; he serves no master but himself. The Demon Lord of the
Ancestral Cave has sworn itself to him, and lends him the fire of the abyss."
"""

[[text]]
number = 10080
called_from = "Textblock #10079"
text = """
"Destroy the Demon Lord, and bring me proof."

{hint}<Slay the Demon Lord in the Ancestral Cave!>{/hint}
"""

[[text]]
number = 10082
called_from = "Textblock #10081"
text = """
The Demon Lord roars as hellfire bursts from its wounds. As it falls, a glowing
sigil burns itself into the stone where it lay: the mark of its power, torn
free of its body.

{hint}<Return to the gaunt one weaver and tell him of the {k}demon{/k}!>{/hint}
"""

[[text]]
number = 10083
called_from = "Textblock #9706"
text = """
The weaver listens, then draws a plate of black iron from his pouch. "I took
the liberty of capturing the demon's sigil."
"""

[[text]]
number = 10085
called_from = "Textblock #10084"
text = """
He hands you a demon-headed glyph, hot to the touch. "Raise this in Magnus'
presence, and the Demon Lord's fury will flow into you. But first, his last
guardian must fall: the Onyx Juggernaut, in the Ancestral Cave."

{hint}<Slay the Onyx Juggernaut in the Ancestral Cave!>{/hint}
"""

[[text]]
number = 10086
called_from = "Textblock #428"
text = """
Balthazar throws back his head and laughs. "Magnus is dead! No one challenges
me in my own realm."
"""

[[text]]
number = 10088
called_from = "Textblock #10087"
text = """
He reaches out and touches the black icon at your shoulder, and it bursts into
dark red flame. "Your Icon of Evil is complete. No chain will hold you while it
watches over you."

{exp}
"""

[[text]]
number = 10089
called_from = "Textblock #495"
text = """
Chancellor Annora's expression is grim. "I have had troubling news from
Nazareen. The King has closed his gates to us, and our envoys return...
changed. I no longer believe the man upon Nazareen's throne is a king at all,
but a puppet of Magnus. The true throne room was sealed long ago behind a great
mirror in the castle's guard tower. Find a way through, and if the King is
false, destroy him."

{hint}<Find the mirror in the guard tower of Castle Nazareen, and confront the King!>{/hint}
"""

[[text]]
number = 10091
called_from = "Textblock #10090"
text = """
The King of Nazareen bellows as he falls, and his enormous body begins to melt
like wax, revealing a writhing mass of purple flesh beneath. With a wet hiss it
dissolves entirely, leaving only an empty crown. Magnus' puppet is gone.

{hint}<Seek out the gaunt one weaver in the Dreary Forest, and tell him you are a
champion of the {k}good{/k}!>{/hint}
"""

[[text]]
number = 10092
called_from = "Textblock #9706"
text = """
The weaver regards you for a long moment. "A champion of the Light. Magnus
fears your kind more than most. His greatest servant among the beasts is the
Kryon Dragon, which lairs in a glowing cave not far from here. Its frozen
breath feeds the shield that guards him."
"""

[[text]]
number = 10094
called_from = "Textblock #10093"
text = """
"Slay the dragon, and return to me. I will have something for you."

{hint}<Slay the Kryon Dragon in the glowing cave of the Dreary Forest!>{/hint}
"""

[[text]]
number = 10096
called_from = "Textblock #10095"
text = """
With a final, shuddering roar the Kryon Dragon collapses, and the frost-light
of its cave fades to a dull glow. A sliver of icy purple light rises from its
body and streaks away into the forest.

{hint}<Return to the gaunt one weaver and tell him of the {k}dragon{/k}!>{/hint}
"""

[[text]]
number = 10097
called_from = "Textblock #9706"
text = """
The weaver nods. "Good. Magnus has lost much of his shield. Now, take this." He
presses a smooth, round stone into your hand.
"""

[[text]]
number = 10099
called_from = "Textblock #10098"
text = """
"A rainbow rune. Raise it when you stand before Magnus, and its light will mend
the wounds of you and your companions. It will work only in his presence. But
first, his last guardian must fall: the Onyx Juggernaut, in the Ancestral Cave.
While it stands, Magnus cannot be harmed."

{hint}<Slay the Onyx Juggernaut in the Ancestral Cave!>{/hint}
"""

[[text]]
number = 10100
called_from = "Textblock #335"
text = """
Chancellor Annora rises from her desk as you enter. "Magnus is truly destroyed?
Then the realm owes you a debt it can never repay."
"""

[[text]]
number = 10102
called_from = "Textblock #10101"
text = """
She lays her hands on either side of your halo, and it flares a brilliant gold.
"Your Aura of Light is made whole. Call upon it, and it will burn away any
darkness laid upon you."

{exp}
"""
