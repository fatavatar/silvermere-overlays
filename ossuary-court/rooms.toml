name = "Ossuary Court, Gate of Bone"
desc = """
The court ends at a great gate of black bone, bolted shut and carved
with a single eye. Before it stands a figure twelve feet tall in a
hooded cloak of shadow, a scythe resting on its shoulder. It does not
move, but the ash around its feet has stopped falling.
"""
