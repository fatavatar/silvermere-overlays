name = "Ossuary Court, the Unmaker's Hall"
desc = """
A long hall of bone runs on beyond the gate. Its walls are built from
the skeletons of things that were never men: wings, horns, coiled
spines, a skull with three eye sockets. Every one of them has been
carefully taken apart and put back together wrong.
"""
