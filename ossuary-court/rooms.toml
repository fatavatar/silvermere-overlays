[[room]]
map = 22
room = 59
name = "Ossuary Court, Arachnigoth's Pit"
desc = """
The gallery floor gives way to a pit lined with webs as thick as
ship's rope, hung with bundled shapes that were once people. At the
bottom, something the size of a house unfolds its legs one at a time.
It is made entirely of bone, and it is very, very hungry.
"""
exits = { up = 58 }
specmon = 2135

[[room]]
map = 22
room = 60
name = "Ossuary Court, the Herald's Arch"
desc = """
A high arch of fused skulls opens onto a red glow beyond. Before it
stands a tall, beautiful woman in a gown of grey ash, a staff of black
bone in her hand. She smiles as you approach. "You are expected," she
says. "The Court will see you now. Most of you."
"""
exits = { east = 73, west = 43 }
specmon = 2136

