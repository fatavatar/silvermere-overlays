# The Ossuary Court's monsters. Monster group 13 (Group8) holds the spawns: no room spawns that
# group, and its one realm monster, the horned demon, has generation index 1, outside every range
# used here. The generation index picks the tier each zone spawns:
#   11 ossuary swarm, 12 bone-knight, 13 ash-wraith, 14 chaos demonling, 15 greater hellion,
#   16 charnel priest.
# The bone stair spawns 11-12, the galleries 11-13, the Court of Ash 13-16 and the Unmaker's
# Hall 15-16.
#
# Band 200-250 (docs/content-areas.md): commons 3,500-4,100 HP and 150-600 damage a round for
# 600,000-800,000 experience a kill; bosses 12,500-14,750 HP and 620-830 damage for 240-280
# million. Party bosses: 15,000-27,000 HP (32,767 at most) and 1,200-1,800 damage. Experience a
# kill is exp x level; every monster here is level 1.
#
# The marble knight (1064) and the Death Reaper (1371) are realm monsters nothing ever spawned.
# The chaos demonling, greater hellion, arachnigoth and Lorzina the plan meant to retune are all
# summoned or transformed into somewhere in the realm, so the court's are new monsters copied
# from them.
#
# Attack chances are cumulative: a slot's pct is the roll at or under which it is picked. A
# spell attack's accuracy is the spell, its min the cast chance and its max the cast level.

