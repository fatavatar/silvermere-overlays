[[news]]
date = "2026-11-11"
kind = "new"
title = "Laughter above the Padded Cells"
text = """
The keepers of the old madhouse swear the cells are empty now. Then why, they ask, does the \
ceiling of the last padded cell glow gold at night, and who is pacing up there?

Someone who has seen a hundred winters of adventure might climb up and find out."""
