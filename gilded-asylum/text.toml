# ---------------------------------------------------------------- lore

[[text]]
number = 10247
text = """
{ansi:0;32}"Iron for your skin, embers for your blood, clarity for your head. One drink
 lasts the better part of a day. I'll make them for you once you've helped me
 with Shrefwan, from what the ward heads carry: {ansi:1;32}ember{ansi:0;32}, {ansi:1;32}quicksilver{ansi:0;32} or {ansi:1;32}iron{ansi:0;32}.
 Bring me one and I'll make you a draught from it."{ansi:0}
"""

[[text]]
number = 10248
text = """
{ansi:0;32}"Three wards. {ansi:1;32}Whispers{ansi:0;32} to the west, {ansi:1;32}fevers{ansi:0;32} to the east, {ansi:1;32}chains{ansi:0;32} off the
 north corridor. The patients don't know they're patients any more, and the
 staff don't know they're staff. Kill what you have to."{ansi:0}
"""

[[text]]
number = 10249
text = """
{ansi:0;32}"Lallim was a singer, before. Shrefwan gave her mirrors to cure her vanity, and
 now there's more of her than there should be. The reflections bite."{ansi:0}
"""

[[text]]
number = 10250
text = """
{ansi:0;32}"Choira was brought in for setting fires. Shrefwan's cure for that was more
 fire. She's in the furnace room at the end of the ward, and she doesn't feel
 the heat at all now."{ansi:0}
"""

[[text]]
number = 10251
text = """
{ansi:0;32}"The violent ones. The jackets in there move by themselves now, and they'll
 hold you still for the wardens. Sharh'Kur broke out of the iron cell a year
 ago and never left it."{ansi:0}
"""
