# Ines the apothecary and the quest "The Gilded Cure" (ability 211 holds the step):
#   0 -> 1  ask about Shrefwan: she asks for one of each reagent from the three ward heads
#   1 -> 2  bring the reagents: she casts the gilded key to the laboratory
#   2 -> 3  kill Shrefwan in both his forms (the second form's death spell runs text 10240)
#   3 -> 4  tell Ines: one of each of her potions and experience
# Once she has made the key (step 2 and on) she trades any reagent for a potion: ember salts
# for a draught of embers, quicksilver tears for a draught of clarity, iron filings for a
# draught of iron.
# Ability 211 is not one of the game's named abilities; Ashfall Valley's quest uses 210.
#
# Asking about a topic shows the topic's block and then runs that block's link as a script, so
# each quest topic is a blank block (as the realm's own are) linking to its script.
#
# Markup: {ansi:N} is the escape sequence ESC[Nm. Narration is plain ({ansi:0}), speech green
# ({ansi:0;32}), keywords bright green ({ansi:1;32}), goals yellow ({ansi:1;33}).

