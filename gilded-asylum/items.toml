# The Gilded Asylum's items.
#
# The three reagents drop from the ward bosses, one each, every time. Ines makes the gilded
# key to the laboratory from one of each (text.toml), and afterwards trades any reagent for
# one of her potions.
#
# The unused class gear (monsters.toml drops it): Titanium Chainmail Tunic 2278 (Sharh'Kur),
# golden crossbow 2422 (the Sorcerer), mithril shuriken 3560 (the Magus), Holy Cross 3565
# (Shrefwan transfigured), Sunburst wrist-guard 3566 (Choira), mirrored choli 2002 (Lallim).

