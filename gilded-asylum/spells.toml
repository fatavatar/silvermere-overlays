# The Gilded Asylum's spells.
#
# 5110 a mirror-patient's reflection splits off a mirror image (and Lallim Whitemane casts it).
# 5114 the Sorcerer's and the Magus's death: two orderlies come running.
# 5115 Shrefwan's death: he gulps a potion and rises transfigured (the second form, 2118).
# 5116-5117 the transfigured Shrefwan's death moves his killer on a step of Ines's quest, as
#           the realm's quest kills do (death spell, EndCast, TextBlock).
# 5118-5120 the apothecary's potions: one drink, an effect that lasts for 1,200 rounds.

# The summons copy the realm's own (217, "choira summon"): cast on the caster, `Summon 0`, the
# monster's number as the spell's value. Their cast message is the realm's empty one (66), not
# the druid's.

[[spell]]
number = 5110
from = 217
name = "split reflection"
msgnum = 66
minval = 2113
maxval = 2113

[[spell]]
number = 5114
from = 217
name = "orderlies come running"
msgnum = 66
minval = 2110
