# The Gilded Asylum's monsters. Monster group 33 (Group28), which no realm monster used, holds
# the wards' spawns; the generation index picks the tier each ward spawns:
#   1 treated lunatic, 2 mirror-patient, 3 orderly, 4 treated murderer,
#   5 animated straitjacket, 6 warden.
# The Ward of Whispers spawns 1-3, the Ward of Fevers 3-4, the Ward of Chains 4-6.
#
# Band 100-150 (docs/content-areas.md): commons 2,100-4,500 HP and 150-350 damage a round for
# 300,000-550,000 experience a kill; bosses 6,800-10,500 HP and 280-500 damage for 45-130
# million. Experience a kill is exp x level; every monster here is level 1.
#
# The crazed lunatic (262), depraved murderer (496), Shrefwan the Alchemist (1385), the
# Demented Sorcerer (1386) and the Deranged Magus (1387) are realm monsters nothing ever
# spawned. The ward bosses and wardens copy realm monsters that the realm's own quests still
# use (610-612, 1059), so they are new records rather than changes.
#
# Attack chances are cumulative: a slot's pct is the roll at or under which it is picked.

