room = 7
name = "Gilded Asylum, Ward of Whispers"
desc = """
Rows of iron beds stand under white sheets in a long, dim ward. The
sheets move, though there is no draught, and from every side comes a
soft, constant whispering that stops whenever you turn towards it.
Mirrors have been hung over every bed, angled so that each patient
could only ever see itself.
"""
exits = { south = 12, east = 8 }
room_type = "Lair"
mongroup = 33
