[[room]]
map = 20
room = 70
name = "Gilded Asylum, Sorcerer's Landing"
desc = """
The stair opens onto a landing hung with star charts, every one of
them wrong. A gaunt man in a robe sewn with tiny mirrors stands at a
lectern, writing in a book with no pages. He looks up as you arrive
and smiles with far too many teeth.
"""
exits = { north = 69, south = 71 }
specmon = 1386

[[room]]
map = 20
room = 71
name = "Gilded Asylum, Magus's Landing"
desc = """
The landing narrows before a pair of gilded doors, sealed with a lock
in the shape of an open mouth. A hunched figure in scholar's robes
paces before them, counting his own fingers over and over and never
reaching the same number twice.
"""
exits = { north = 70, south = { target = 72, kind = "Key", par1 = 5113, par2 = 2, par3 = -999, par4 = 1 } }
specmon = 1387

[[room]]
map = 20
room = 72
name = "Gilded Asylum, Shrefwan's Laboratory"
desc = """
Tables crowded with glassware fill a long vaulted cellar. Alembics
bubble over blue flames, copper pipes run along the ceiling and drip
into pans of gilding, and jars of floating things line every wall. In
the far corner a cabinet of black wood stands open, its shelves bright
with stolen treasures.
"""
exits = { north = { target = 71, kind = "Key", par1 = 5113, par2 = 2, par3 = -999, par4 = 1 }, south = 73 }

[[room]]
