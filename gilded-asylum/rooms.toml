[[room]]
map = 20
room = 44
name = "Gilded Asylum, Furnace Room"
desc = """
A great iron furnace fills the end of the fever ward, its door hanging
open on a bed of white coals. The air ripples with heat and the floor
is too hot to stand on for long. A woman in a burning gown tends the
coals with her bare hands, singing to them softly, and does not look
up.
"""
exits = { west = 39 }
specmon = 2115

[[room]]
