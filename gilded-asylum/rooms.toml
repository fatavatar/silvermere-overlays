[[room]]
map = 20
room = 67
name = "Gilded Asylum, Iron Cell"
desc = """
The last cell of the ward is lined with iron plate and has no window.
Its door has been torn from the hinges and thrown across the corridor.
Inside, a huge figure squats among broken chains, wearing the twisted
remains of a restraint collar as if it were a crown.
"""
exits = { west = 57 }
specmon = 2117

[[room]]
map = 20
room = 68
name = "Gilded Asylum, Laboratory Stair"
desc = """
A spiral stair of gilded iron winds down into the dark below the
rotunda. The steps are worn in the middle by many feet, and the brass
handrail is sticky. A sharp chemical smell rises from below, and with
it the sound of two voices arguing, very calmly, about the colour of
pain.
"""
exits = { up = 5, down = 69 }

[[room]]
