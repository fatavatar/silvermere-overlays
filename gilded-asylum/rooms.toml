[[room]]
map = 20
room = 74
name = "Gilded Asylum, Alchemical Sanctum"
desc = """
The laboratory ends in a round chamber around a vat of liquid gold,
kept molten by a ring of furnaces. A thin old man in a gilded apron
stands on its rim, sipping from a beaker that smokes. His skin has
begun to shine like the metal in the vat, and his eyes have no whites
left at all.
"""
exits = { west = 73 }
specmon = 1385

# The crawlspace above the Padded Cell: a text exit cannot change maps, so the panel
# leads to this room on map 9, and it climbs up to the asylum.
[[room]]
map = 9
room = 1500
name = "Padded Cell, Crawlspace"
desc = """
Above the padded cell the ceiling panel opens onto a crawlspace
between the joists, thick with dust and old horsehair. A faint golden
light shows through the boards overhead, and you can hear footsteps up
there, pacing, always pacing.
"""
exits = { up = { target = 1, kind = "MapChange", par1 = 20 }, down = 1255 }

# The way in: the Padded Cell gets a loose ceiling panel ("climb panel").
[[room_change]]
map = 9
room = 1255
why = "the way up into the Gilded Asylum: a text exit, climb panel"
set = { exits = { up = { target = 1500, kind = "Text", par1 = 10330, par3 = 10331, par4 = 10332 } }, desc = """
The walls of this small, square room once were padded with thick cloth
mats. Now, however, they have been torn to shreds and in many places
are stained with dark spots that look suspiciously like blood. One
panel of the ceiling hangs loose, and a faint golden light shows
around its edges.
""" }
was = { name = "Padded Cell" }
