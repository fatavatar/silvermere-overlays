name = "Gilded Asylum, Ward of Fevers"
desc = """
Heat beats out of this ward like an open oven. Braziers burn between
the beds, and the walls have blistered and peeled under their gilding.
Patients were brought here to have fevers sweated out of them; from
the scorch marks on the straps, the treatment went on long after the
fevers stopped.
"""
exits = { south = 30, east = 27 }
room_type = "Lair"
mongroup = 33
