name = "Gilded Asylum, Whispering Gallery"
desc = """
The ward ends in a round gallery lined with mirrors from floor to
dome. Your reflection stands in every one of them, but not all of the
reflections are moving with you. A pale woman sits on a gilded throne
in the centre, combing hair as white as snow, and every mirror
whispers when she speaks.
"""
exits = { east = 16 }
specmon = 2116

