room = 45
name = "Gilded Asylum, Ward of Chains"
desc = """
This ward held the violent ones. Every bed is bolted to the floor and
hung with gilded chains, and the walls are scored with deep gouges at
the height of a man's shoulders. Many of the chains have been snapped.
A few have not, and whatever they held is no longer in them.
"""
exits = { south = 49, east = 46 }
room_type = "Lair"
