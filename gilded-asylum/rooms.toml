[[room]]
map = 20
room = 1
name = "Gilded Asylum, Attic Landing"
desc = """
You climb out of the crawlspace onto bare boards. Behind a rotted
screen the attic opens into a landing hung with velvet, and every
nail, hinge and picture frame has been gilded. The gold is very new.
The plaster under it is cracked and stained, and somewhere ahead
someone is laughing at nothing.
"""
exits = { down = { target = 1500, kind = "MapChange", par1 = 9 }, south = 2 }

[[room]]
map = 20
room = 2
name = "Gilded Asylum, Gilded Corridor"
desc = """
A long corridor runs between doors with small barred windows. The
floorboards have been gilded too, and they ring dully underfoot like
coins. Brass plates by each door name a treatment rather than a
patient: COLD BATHS, LEECHING, THE QUIETING DRAUGHT. Most of the doors
stand open.
"""
exits = { north = 1, south = 3 }

