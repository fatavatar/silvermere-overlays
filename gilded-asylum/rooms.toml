[[room]]
map = 20
room = 5
name = "Gilded Asylum, Rotunda"
desc = """
The corridors meet under a dome painted with a sky of gold stars. A
marble statue of a physician stands in the centre, one hand raised in
blessing and the other holding a cup; someone has filled the cup with
teeth. Signs point to the wards of Whispers, Fevers and Chains, and a
fourth, newer sign points down a stair to THE LABORATORY - STAFF ONLY.
"""
exits = { north = 4, east = 30, west = 15, down = 68, southeast = 6 }

[[room]]
map = 20
room = 6
name = "Gilded Asylum, Dispensary"
desc = """
Shelves of stoppered bottles line this narrow room, each one labelled
in a neat and careful hand. A heavy table has been pushed against the
door to the wards, and behind it a lamp burns low over a mortar, a
pestle and an open ledger. It is the only room you have seen that
nobody has gilded.
"""
exits = { northwest = 5 }
specmon = 2119

[[room]]
