[[room]]
map = 21
room = 63
name = "Rocspire, the Longhall"
desc = """
A hall of black timber runs the length of the saddle, its roof beams
carved with rocs in flight. A fire burns down the middle of it in a
long stone trench, and benches line the walls under hanging shields.
The air is thick with smoke, ale and old songs.
"""
exits = { east = 64, west = 52 }

