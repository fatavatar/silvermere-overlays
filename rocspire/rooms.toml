[[room]]
map = 21
room = 67
name = "Rocspire, Saga Hearth"
desc = """
At the end of the Longhall a small fire burns in a round hearth, and
an old woman sits beside it with her hands folded in her lap. Her eyes
are milk white. The walls around her are hung with knotted cords,
hundreds of them, each knot a deed and each cord a life.
"""
exits = { south = 64 }
specmon = 2129

[[room]]
map = 21
room = 68
name = "Rocspire, Champion's Ring"
desc = """
A ring of stones has been set into the Longhall's floor before the
high seat, the ground inside it trampled hard and dark with old blood.
A lean warrior in lacquered armour from some far country waits inside
it, a long curved sword resting across her knees.
"""
exits = { east = 69, west = 66 }
specmon = 2128

[[room]]
map = 21
room = 69
name = "Rocspire, Jarl's High Seat"
desc = """
A raised seat of roc bone stands at the head of the Longhall, draped
in a white pelt larger than any bear's. A broad man with a beard
braided with gold rises from it as you approach, a heavy axe in one
hand and a drinking horn in the other.
"""
exits = { west = 68 }
specmon = 2127

[[room]]
map = 21
room = 70
name = "Rocspire, Eyrie"
desc = """
A shelf of rock juts out from the spire into empty air, its edge worn
smooth by the landing of enormous claws. Bones lie scattered
everywhere: deer, horses, oxen, and some that once wore armour. The
wind here smells of blood.
"""
exits = { south = 79, east = 71, up = 115 }
room_type = "Lair"
mongroup = 34
minlevel = 5
maxlevel = 6
maxmonsters = 2

[[room]]
map = 21
room = 71
name = "Rocspire, Roc Nests"
desc = """
Great nests of whole trees and bones crown the spires here, each one
as wide as a house. The ground between them is a slope of broken
eggshell and droppings, and the air is full of the screaming of hungry
chicks. Overhead, a shadow passes, and then another.
"""
exits = { south = 80, east = 72, west = 70 }
room_type = "Lair"
mongroup = 34
minlevel = 5
maxlevel = 6
