[[text]]
number = 10264
text = """
{ansi:0}Sigrun ties a single knot at the start of a new cord and holds it up.

{ansi:0;32}"There. That's you, so far. A short saga. Three deeds would make it a long one.

 "The Roc Matriarch nests on the highest spire. Bring me a pinion from her
 wing. Jarl Hrafnkel sits in the Longhall and wears his father's torc. He
 will not give it up while he breathes. And at the top of the Stormcrown
 hangs the storm-bell. Ring it, so the ancestors hear your name.

 "Do all three and come back to me, and I'll knot your saga, and see you
 properly armed for the rest of it."{ansi:0}

{ansi:1;33}<Bring Sigrun the Roc Matriarch's pinion and Jarl Hrafnkel's torc, and ring
the storm-bell at the top of the Stormcrown.>{ansi:0}
"""

[[text]]
number = 10265
