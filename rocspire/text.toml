# Sigrun the saga-keeper and the quest "The Long Saga" (ability 212 holds the step, 213 whether
# the storm-bell has rung):
#   0 -> 1  ask for your saga: she names the three deeds
#   the deeds, in any order: the Roc Matriarch's pinion and Jarl Hrafnkel's torc (both drop
#           every time), and ringing the storm-bell on the Stormcrown (the room's command
#           sets 213 once the saga is begun)
#   1 -> 2  bring her the pinion and the torc with the bell rung: she takes them and gives each
#           class its reward (Skald, Warrior, Bard, Mystic; anyone else experience alone)
# Abilities 212 and 213 are not the game's named abilities; Ashfall Valley and the Gilded
# Asylum use 210 and 211.
#
# Asking about a topic shows the topic's block and then runs that block's link as a script, so
# each quest topic is a blank block linking to its script.
#
# Markup: {ansi:N} is the escape sequence ESC[Nm. Narration is plain ({ansi:0}), speech green
# ({ansi:0;32}), keywords bright green ({ansi:1;32}), goals yellow ({ansi:1;33}).

