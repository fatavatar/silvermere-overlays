[[text]]
number = 10281
text = """
{ansi:0}You unchain the clapper, throw your weight on the bell-rope, and the storm-bell
swings. Its note is not loud. It is everywhere at once: in the stones, in the
storm, in your teeth and in your bones. For a moment the lightning stops, and
in the stillness you hear voices, a great many of them, saying your name.

{ansi:1;33}<The storm-bell has rung for you. Return to Sigrun in the Longhall.>{ansi:0}
"""

[[text]]
number = 10282
text = """
{ansi:0}You heave at the bell-rope. The storm-bell sways a little, and its chained
clapper thumps dully against the iron. Nothing answers.
"""

# ---------------------------------------------------------------- lore

[[text]]
number = 10273
text = """
{ansi:0;32}"The Matriarch was old when my grandmother was a girl. The hunters take her
 young, and she takes the hunters. It's been that way a long time. She nests
 up past the Eyries, on the highest spire."{ansi:0}
"""

[[text]]
number = 10274
text = """
{ansi:0;32}"Hrafnkel. A good jarl, as jarls go: he feeds us and he fights for us, and he
 kills anyone who asks him for that torc. Mind his champion, the far-sworn
 woman. She waits in the ring before his seat."{ansi:0}
"""

[[text]]
number = 10275
text = """
{ansi:0;32}"The storm-bell hangs at the top of the Stormcrown, past the Eyries and up the
 long stair. The storm lives up there. Walking lightning. Ring the bell and
 every ancestor hears you."{ansi:0}
"""

[[text]]
number = 10276
text = """
{ansi:0;32}"We hunt the rocs, and the rocs hunt us. We came up here before the mountain
 had a name, and we'll be here when it's lost it again. Strangers don't
 usually last as long as you have."{ansi:0}
"""
