[[text]]
number = 10261
text = """
{ansi:0}The old woman turns her face towards you before you have said a word. Her eyes
are white as milk, but they find you all the same.

{ansi:0;32}"A stranger, come up the bridges. I am Sigrun. I keep the sagas of these
 people, every deed of every life, in knots." She lifts a cord from her lap.
 "Every life gets a cord. Do you want one? Ask me for your {ansi:1;32}saga{ansi:0;32}, then, and
 I'll tell you what {ansi:1;32}deeds{ansi:0;32} it wants."{ansi:0}
"""

