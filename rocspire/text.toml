[[text]]
number = 10268
text = """
{ansi:0}Sigrun runs the pinion through her fingers and weighs the torc in her palm, and
then she ties three knots in your cord, slowly, one after another.

{ansi:0;32}"A skald. Then you'll want to sing it yourself." She reaches behind her and
 lifts down a shield strung like a harp, a helm and a maul. "My husband's. He
 was the last skald of the Longhall. He'd want them used."{ansi:0}

{ansi:1;33}<Sigrun gives you a war-harp shield, a saga helm and a runed war-maul.>{ansi:0}
{ansi:0;36}<You gain 500,000,000 experience!>{ansi:0}
"""

[[text]]
number = 10269
text = """
{ansi:0}Sigrun runs the pinion through her fingers and weighs the torc in her palm, and
then she ties three knots in your cord, slowly, one after another.

{ansi:0;32}"A warrior's saga. Short words, long deeds." She points to a chest by the
 hearth. "The smiths made that for the Jarl's son. He didn't live to wear it.
 You have."{ansi:0}

{ansi:1;33}<Sigrun gives you a ring-mail hauberk, ring-mail leggings and a bearded
greataxe.>{ansi:0}
{ansi:0;36}<You gain 500,000,000 experience!>{ansi:0}
"""

[[text]]
number = 10270
text = """
{ansi:0}Sigrun runs the pinion through her fingers and weighs the torc in her palm, and
then she ties three knots in your cord, slowly, one after another.

{ansi:0;32}"There. Long enough to sing." She draws something folded from beside her and
 presses it into your hands. "For the rest of it."{ansi:0}

{ansi:1;33}<Sigrun gives you a gift for your calling.>{ansi:0}
{ansi:0;36}<You gain 500,000,000 experience!>{ansi:0}
"""

[[text]]
number = 10271
text = """
{ansi:0}Sigrun runs the pinion through her fingers and weighs the torc in her palm, and
then she ties three knots in your cord, slowly, one after another.

{ansi:0;32}"There. A long saga, and a good one. I've nothing in this hall made for your
 kind, but the ancestors know your name now. That's worth more."{ansi:0}

{ansi:0;36}<You gain 500,000,000 experience!>{ansi:0}
"""

[[text]]
number = 10272
text = """
{ansi:0;32}"Your cord is hanging with the others. It's a long one." She almost smiles.
 "Go and make it longer."{ansi:0}
"""

