# The Rocspire's monsters. Monster group 34 (Group29), which no realm monster used, holds the
# spawns; the generation index picks the tier each zone spawns:
#   1 hawk swarm, 2 nomad raider, 3 frost-pelt shaman, 4 nomad huntmaster,
#   5 roc broodling, 6 giant roc, 7 storm elemental.
# The bridges and ledges spawn 1-2, the camp 2-4, the nests 5-6, the Stormcrown stair 6-7 and
# its crown 7.
#
# Band 150-200 (docs/content-areas.md): commons 2,900-3,600 HP and 200-450 damage a round for
# 300,000-500,000 experience a kill; bosses 9,500-13,000 HP and 570-740 damage for 150-280
# million. Experience a kill is exp x level; every monster here is level 1.
#
# The blood hawk (661), the nomadic huntsman (205) and the giant roc (792) are realm monsters
# nothing ever spawned, retuned. The rest copy realm monsters still in use.
#
# Attack chances are cumulative: a slot's pct is the roll at or under which it is picked.

