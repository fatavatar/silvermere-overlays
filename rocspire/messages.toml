# The Rocspire's messages. An attack message is (to you, to the room); a death message's third
# line is the death.

# ---------------------------------------------------------------- the saga's refusals

[[message]]
number = 10350
msgs = ["Sigrun turns her blind eyes towards you and shakes her head. \"Your saga is too short yet. Come back when it is longer.\"", "", ""]

[[message]]
number = 10351
msgs = ["Sigrun's fingers find no feather in your hands. \"The Matriarch's pinion first. She nests on the highest spire.\"", "", ""]

[[message]]
number = 10352
msgs = ["Sigrun's fingers find no torc at your neck. \"The Jarl's torc. He will not give it up while he lives.\"", "", ""]

