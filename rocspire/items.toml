# The Rocspire's items.
#
# The Long Saga's deeds: the Roc Matriarch's pinion and Jarl Hrafnkel's torc (both always drop)
# and ringing the storm-bell (a room command, text.toml). Sigrun the saga-keeper takes the two
# and gives each class its own reward: Skalds and Warriors three pieces, Bards and Mystics one.
# Skalds may only wield blunt weapons, so the Skald's weapon is a war-maul rather than an axe.
#
# The unused crimson battle-shield (2532) and titanium shield (2533) drop from the raiders and
# huntmasters, and the sadamune (1824) from the Jarl's champion (monsters.toml).

[[item]]
number = 5125
from = 341
name = "roc matriarch's pinion"
item_type = "Special"
charges = -1
destroymsg = 0
weight = 10
robable = 0
abilities = []
desc = """
A single flight feather from the Roc Matriarch's wing, white with age
and longer than a spear. The wind tugs at it even indoors, as if it
still wants to fly.
"""

[[item]]
number = 5126
from = 341
name = "Hrafnkel's torc"
item_type = "Special"
charges = -1
destroymsg = 0
weight = 5
robable = 0
abilities = []
desc = """
A heavy torc of twisted gold, its ends shaped as two rocs' heads. It
is still warm from the Jarl's throat, and the gold is worn smooth on
the inside by a lifetime of wearing.
"""

# ---------------------------------------------------------------- the Skald's reward

[[item]]
number = 5127
from = 2533
name = "war-harp shield"
classes = [24]
ac = 130
dr = 45
abilities = [["MagicResist", 10], ["MinLevel", 150]]
desc = """
A tall shield of roc bone and black iron, strung across its face with
seven strings of braided gut. Struck with a sword, it rings out a
chord that the nomads say an ancestor can hear.
"""

[[item]]
number = 5128
from = 1822
name = "saga helm"
classes = [24]
level = 1
ac = 110
dr = 40
abilities = [["Health", 5], ["MinLevel", 150]]
desc = """
A helm of blackened steel with long cheek-guards, its brow carved with
a running band of knotwork. Every knot is a deed, and the knots run
all the way round and back to the beginning.
"""

[[item]]
number = 5129
from = 2570
name = "runed war-maul"
classes = [24]
mindmg = 42
maxdmg = 72
speed = 5300
strreq = 90
accuracy = 15
abilities = [["Magical", 5], ["MinLevel", 150]]
desc = """
A two-handed maul with a head of dark iron the size of a bread loaf,
its haft wound with white roc leather. Runes of storm and memory are
cut into every face of the head, and they glow faintly in the dark.
"""

